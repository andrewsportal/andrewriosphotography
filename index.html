<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Andrew Rios Photography</title>

<link rel="preconnect" href="https://wsrv.nl" crossorigin>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gap: clamp(8px, 1vw, 12px);
    --safe-top:    env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --safe-left:   env(safe-area-inset-left);
    --safe-right:  env(safe-area-inset-right);

    /* ── LOCKED DARK — always black regardless of system setting ── */
    --color-bg:            #000000;
    --color-grid-item-bg:  #1c1c1e;
    --color-footer-border: rgba(84,84,88,0.65);
    --color-footer-text:   rgba(235,235,245,0.30);
    --color-btn-bg:        rgba(118,118,128,0.24);
    --color-btn-text:      rgba(235,235,245,0.6);
    --color-btn-bg-active: rgba(118,118,128,0.36);
    --color-lb-bg:         #000000;
    --color-lb-close-bg:   rgba(60,60,67,0.6);
    --color-lb-close-text: rgba(255,255,255,0.92);
    --color-lb-dot:        rgba(255,255,255,0.35);
    --color-lb-dot-active: #ffffff;

    /* ── TYPE & SPACING ── */
    --text-caption:  clamp(0.625rem, 2.5vw, 0.6875rem);
    --text-footnote: clamp(0.75rem, 3.0vw, 0.8125rem);
    --text-body:     clamp(0.9rem, 1.8vw, 1.04rem);
    --text-title:    clamp(1.7rem, 5.6vw, 3rem);
    --text-subtitle: clamp(0.84rem, 2.4vw, 0.98rem);
    --radius-card: clamp(14px, 2vw, 20px);
    --radius-pill: 999px;
    --content-max: 1320px;
    --page-pad-x: clamp(14px, 3.6vw, 28px);
    --space-block: clamp(24px, 6vw, 48px);
  }

  html {
    background: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
    scrollbar-gutter: stable both-edges;
  }

  body {
    min-height: 100vh;
    background: var(--color-bg);
    color: var(--color-btn-text);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    line-height: 1.45;
    letter-spacing: -0.01em;
    overflow-x: hidden;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
  }

  .page-shell {
    width: min(100%, var(--content-max));
    margin: 0 auto;
    padding-left:  calc(var(--safe-left)  + var(--page-pad-x));
    padding-right: calc(var(--safe-right) + var(--page-pad-x));
  }

  .site-header {
    padding-top: calc(var(--safe-top) + clamp(22px, 4.5vh, 44px));
    padding-bottom: clamp(18px, 3.6vh, 30px);
    display: grid;
    gap: 10px;
  }

  .site-kicker {
    font-size: var(--text-caption);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-footer-text);
  }

  .site-title {
    font-size: var(--text-title);
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--color-lb-close-text);
    line-height: 1.03;
  }

  .site-subtitle {
    max-width: 62ch;
    font-size: var(--text-subtitle);
    color: var(--color-btn-text);
    letter-spacing: -0.01em;
  }

  /* ── MASONRY GRID ── */
  #grid {
    display: flex;
    gap: var(--gap);
    width: 100%;
    align-items: flex-start;
  }

  .col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .grid-item {
    width: 100%;
    cursor: pointer;
    position: relative;
    border-radius: var(--radius-card);
    border: 0.5px solid var(--color-footer-border);
    background: var(--color-grid-item-bg);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    box-shadow: 0 0 0 0.5px var(--color-footer-border), 0 16px 36px -30px var(--color-bg);
  }

  .grid-item::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: inset 0 0 0 0.5px var(--color-footer-border);
    opacity: 0;
  }

  .grid-item img {
    width: 100%;
    height: auto;
    display: block;
    transform-origin: center;
    transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
  }

  .grid-item:active {
    transform: scale(0.992);
  }

  .grid-item:active img {
    opacity: 0.78;
  }

  .grid-item:focus-visible {
    outline: 2px solid #0a84ff;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .grid-item.animate {
      animation: fadeIn 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
  }

  @media (hover: hover) and (pointer: fine) {
    .grid-item {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    .grid-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 0 0.5px var(--color-footer-border), 0 24px 44px -30px var(--color-bg);
    }

    .grid-item:hover::after {
      opacity: 1;
    }

    .grid-item:hover img {
      transform: scale(1.02);
    }
  }

  /* ── BOTTOM BAR ── */
  #bottomBar {
    display: none;
    align-items: center;
    justify-content: center;
    margin-top: var(--space-block);
    margin-bottom: clamp(10px, 2.2vh, 18px);
  }

  /* ── BACK TO TOP BUTTON ── */
  #backTopBtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 24px;
    border-radius: var(--radius-pill);
    border: 0.5px solid var(--color-footer-border);
    background: var(--color-btn-bg);
    color: var(--color-btn-text);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    font-size: var(--text-footnote);
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow: 0 0 0 0.5px var(--color-footer-border), 0 14px 28px -20px var(--color-bg);
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  #backTopBtn svg {
    transition: transform 0.2s ease;
  }

  #backTopBtn:active {
    background: var(--color-btn-bg-active);
    transform: scale(0.97);
  }

  #backTopBtn:focus-visible {
    outline: 2px solid #0a84ff;
    outline-offset: 2px;
  }

  @media (hover: hover) and (pointer: fine) {
    #backTopBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 0 0.5px var(--color-footer-border), 0 18px 34px -22px var(--color-bg);
    }

    #backTopBtn:hover svg {
      transform: translateY(-1px);
    }
  }

  /* ── FOOTER ── */
  footer {
    margin-top: clamp(6px, 2vh, 12px);
    padding-top: clamp(16px, 2vh, 22px);
    padding-bottom: calc(var(--safe-bottom) + clamp(24px, 4vh, 36px));
    display: none;
    align-items: center;
    justify-content: center;
    border-top: 0.5px solid var(--color-footer-border);
  }

  footer span {
    font-size: var(--text-caption);
    font-weight: 500;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--color-footer-text);
  }

  /* ── LIGHTBOX ── */
  .lb {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: var(--color-lb-bg);
    opacity: 0;
    pointer-events: none;
    touch-action: none;
    user-select: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .lb { transition: opacity 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .lb-slot { transition: opacity 0.2s ease; }
  }

  .lb.open {
    opacity: 1;
    pointer-events: all;
  }

  .lb-slot {
    position: absolute;
    top: calc(var(--safe-top) + clamp(72px, 10vh, 98px));
    bottom: calc(var(--safe-bottom) + clamp(72px, 10vh, 96px));
    left: 0;
    right: 0;
    padding: 0 clamp(14px, 4vw, 40px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lb-slot.hidden  { opacity: 0; pointer-events: none; }
  .lb-slot.visible { opacity: 1; }

  .lb-slot img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    border-radius: clamp(12px, 2vw, 18px);
    box-shadow: 0 0 0 0.5px var(--color-footer-border), 0 28px 42px -30px var(--color-bg);
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  /* ── LIGHTBOX CLOSE ── */
  .lb-close {
    position: absolute;
    top:   calc(var(--safe-top)   + 14px);
    right: calc(var(--safe-right) + 14px);
    z-index: 10;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 0.5px solid var(--color-footer-border);
    background: var(--color-lb-close-bg);
    color: var(--color-lb-close-text);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 0 0.5px var(--color-footer-border), 0 14px 28px -22px var(--color-bg);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.18s ease;
  }

  .lb-close::before {
    content: '';
    position: absolute;
    inset: -5px;
  }

  .lb-close svg { pointer-events: none; }

  .lb-close:active {
    transform: scale(0.92);
  }

  .lb-close:focus-visible {
    outline: 2px solid #0a84ff;
    outline-offset: 2px;
  }

  .lb-prev, .lb-next {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 28%;
    z-index: 8;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    pointer-events: none;
  }

  .lb.open .lb-prev,
  .lb.open .lb-next { pointer-events: all; }

  .lb-prev { left: 0; }
  .lb-next { right: 0; }

  /* ── PAGE CONTROL DOTS ── */
  .lb-dots {
    position: absolute;
    bottom: calc(var(--safe-bottom) + 24px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }

  .lb-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-lb-dot);
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .lb-dot {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  }

  .lb-dot.active {
    background: var(--color-lb-dot-active);
    width: 22px;
    border-radius: 999px;
  }

  @media (max-width: 720px) {
    .page-shell {
      padding-left:  calc(var(--safe-left)  + 10px);
      padding-right: calc(var(--safe-right) + 10px);
    }
  }
</style>
</head>
<body>
<div class="page-shell">
  <header class="site-header" aria-label="Site introduction">
    <p class="site-kicker">Portfolio</p>
    <h1 class="site-title">Andrew Rios Photography</h1>
    <p class="site-subtitle">A curated body of photography presented with a clean, immersive viewing experience.</p>
  </header>

  <main id="grid" role="main" aria-label="Photo gallery"></main>

  <div id="bottomBar">
    <button id="backTopBtn" aria-label="Scroll back to top">
      Back to top
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>

  <footer role="contentinfo">
    <span>© 2026 Andrew Rios Photography</span>
  </footer>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" id="lbClose" aria-label="Close photo viewer">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l14 14M15 1L1 15"/>
    </svg>
  </button>
  <div class="lb-slot visible" id="slotA"><img id="imgA" src="" alt="" /></div>
  <div class="lb-slot hidden"  id="slotB"><img id="imgB" src="" alt="" /></div>
  <button class="lb-prev" id="lbPrev" aria-label="Previous photo"></button>
  <button class="lb-next" id="lbNext" aria-label="Next photo"></button>
  <div class="lb-dots" id="lbDots" aria-hidden="true"></div>
</div>

<script>
const GITHUB_USER   = 'andrewsportal';
const GITHUB_REPO   = 'andrewriosphotography';
const GITHUB_FOLDER = '';

const EXTS = ['jpg','jpeg','png','webp','heic'];
const RAW  = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;
const API  = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let photos     = [];
let current    = 0;
let activeSlot = 'A';
let appLoaded  = false;
const gridEl     = document.getElementById('grid');
const lb         = document.getElementById('lb');
const slotA      = document.getElementById('slotA');
const slotB      = document.getElementById('slotB');
const imgA       = document.getElementById('imgA');
const imgB       = document.getElementById('imgB');
const dotsEl     = document.getElementById('lbDots');
const backTopBtn = document.getElementById('backTopBtn');

let colL, colR;
let touchStartX, touchStartY, touchStartTime;

/* ── HELPER: PROXY URL GENERATOR ── */
// Automatically compresses and sizes images on the fly via wsrv.nl
function getProxyUrl(rawUrl, width) {
  const cleanUrl = rawUrl.replace(/^https?:\/\//, '');
  return `https://wsrv.nl/?url=${encodeURIComponent(cleanUrl)}&w=${width}&output=webp`;
}

/* ── LOAD ── */
async function load() {
  if (appLoaded) return;
  appLoaded = true;
  try {
    const folder = GITHUB_FOLDER ? `/${GITHUB_FOLDER}` : '';
    // Auto-fetch photos and order from GitHub (Zero manual code updates needed!)
    const [filesRes, orderRes] = await Promise.all([
      fetch(`${API}${folder}`, { headers: { Accept: 'application/vnd.github.v3+json' } }),
      fetch(`${RAW}${GITHUB_FOLDER ? '/' + GITHUB_FOLDER : ''}/order.txt`).catch(() => null)
    ]);
    const files = await filesRes.json();
    if (!Array.isArray(files)) { console.error('GitHub API error', files); return; }

    const fileMap = {};
    files
      .filter(f => f.type === 'file' && EXTS.some(e => f.name.toLowerCase().endsWith('.' + e)))
      .forEach(f => { fileMap[f.name.toLowerCase()] = { name: f.name, url: f.download_url }; });
      
    const stemMap = {};
    Object.keys(fileMap).forEach(key => {
      const stem = key.replace(/\.[^.]+$/, '');
      if (!stemMap[stem]) stemMap[stem] = key;
    });
    
    let ordered = [];
    const seen = new Set();

    if (orderRes && orderRes.ok) {
      const text = await orderRes.text();
      text.split('\n')
        .map(l => l.trim())
        .filter(l => l && !l.startsWith('#'))
        .forEach(name => {
          const stem = name.toLowerCase().replace(/\.[^.]+$/, '');
          const key  = stemMap[stem];
          if (key && !seen.has(key)) {
            seen.add(key);
            const rawImgUrl = `${RAW}/${fileMap[key].name}`;
            ordered.push({ 
              thumb: getProxyUrl(rawImgUrl, 600), // 600px wide for the grid
              full: getProxyUrl(rawImgUrl, 1600)  // 1600px wide for the lightbox
            });
            delete fileMap[key];
            delete stemMap[stem];
          }
        });
    }

    Object.keys(fileMap).sort().forEach(key => {
      if (!seen.has(key)) {
        seen.add(key);
        const rawImgUrl = `${RAW}/${fileMap[key].name}`;
        ordered.push({ 
          thumb: getProxyUrl(rawImgUrl, 600),
          full: getProxyUrl(rawImgUrl, 1600)
        });
      }
    });
    photos = ordered;

    colL = document.createElement('div');
    colR = document.createElement('div');
    colL.className = 'col';
    colR.className = 'col';
    gridEl.appendChild(colL);
    gridEl.appendChild(colR);

    appendPhotos(0, photos.length);
    buildLbDots();

    document.getElementById('bottomBar').style.display = 'flex';
    document.querySelector('footer').style.display = 'flex';

  } catch (e) {
    console.error('Load error:', e);
  }
}

/* ── APPEND ── */
function appendPhotos(from, count) {
  const to    = Math.min(from + count, photos.length);
  const slice = photos.slice(from, to);
  if (!slice.length) return;

  slice.forEach((p, idx) => {
    const globalIdx = from + idx;
    // Deal the photos out like a deck of cards: Left, Right, Left, Right
    const col = globalIdx % 2 === 0 ? 0 : 1; 
    const item = makeItem(p, globalIdx, idx);
    (col === 0 ? colL : colR).appendChild(item);
  });
}

function makeItem(p, globalIdx, localIdx) {
  const div = document.createElement('div');
  div.className = 'grid-item';
  if (!reduceMotion && localIdx < 12) {
    div.classList.add('animate');
    div.style.animationDelay = `${localIdx * 0.03}s`;
  }

  div.setAttribute('role', 'button');
  div.setAttribute('tabindex', '0');
  div.setAttribute('aria-label', `Open photo ${globalIdx + 1} of ${photos.length}`);

  const img = document.createElement('img');
  img.src      = p.thumb;
  img.loading  = globalIdx < 6 ? 'eager' : 'lazy';
  img.decoding = 'async';
  img.alt = `Photo ${globalIdx + 1}`;

  div.appendChild(img);
  div.addEventListener('click', () => openLb(globalIdx));
  div.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openLb(globalIdx);
    }
  });
  return div;
}

/* ── BACK TO TOP ── */
backTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
});

/* ── LIGHTBOX DOTS ── */
const MAX_DOTS = 7;

function buildLbDots() {
  dotsEl.innerHTML = '';
  const n = Math.min(photos.length, MAX_DOTS);
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'lb-dot';
    dotsEl.appendChild(d);
  }
  updateLbDots();
}

function updateLbDots() {
  const dots = [...dotsEl.querySelectorAll('.lb-dot')];
  if (!dots.length) return;
  const half  = Math.floor(MAX_DOTS / 2);
  const start = Math.max(0, Math.min(current - half, photos.length - MAX_DOTS));
  dots.forEach((d, i) => d.classList.toggle('active', start + i === current));
}

/* ── LIGHTBOX ── */
function openLb(i) {
  current = i;
  const img = activeSlot === 'A' ? imgA : imgB;
  
  // 1. Immediately show the cached thumbnail for zero delay
  img.src = photos[i].thumb;
  img.alt = `Photo ${i + 1} of ${photos.length}`;
  
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  lb.setAttribute('tabindex', '-1');
  updateLbDots();
  preloadAdjacent();

  // 2. Silently upgrade to high-res
  const highResImg = new Image();
  highResImg.onload = () => {
    if (current === i) img.src = photos[i].full;
  };
  highResImg.src = photos[i].full;
}

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}

function goTo(i) {
  const target = Math.max(0, Math.min(i, photos.length - 1));
  if (target === current) return;

  const fromSlot = activeSlot === 'A' ? slotA : slotB;
  const toSlot   = activeSlot === 'A' ? slotB : slotA;
  const toImg    = activeSlot === 'A' ? imgB  : imgA;

  current = target;
  
  // 1. Load the thumbnail (already in browser cache) for instant feedback
  toImg.src = photos[current].thumb;
  toImg.alt = `Photo ${current + 1} of ${photos.length}`;

  // 2. Instantly swap the UI to eliminate the stall
  toSlot.classList.replace('hidden', 'visible');
  fromSlot.classList.replace('visible', 'hidden');
  activeSlot = activeSlot === 'A' ? 'B' : 'A';
  updateLbDots();
  preloadAdjacent();

  // 3. Silently upgrade to the full 1600px version in the background
  const highResImg = new Image();
  highResImg.onload = () => {
    if (current === target) {
      toImg.src = photos[current].full;
    }
  };
  highResImg.src = photos[current].full;
}

function goNext() { goTo(current + 1); }
function goPrev() { goTo(current - 1); }

function preloadAdjacent() {
  [current + 1, current - 1]
    .filter(idx => idx >= 0 && idx < photos.length)
    .forEach(idx => { const p = new Image(); p.src = photos[idx].full; });
}

/* ── CONTROLS ── */
document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', goPrev);
document.getElementById('lbNext').addEventListener('click', goNext);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     { closeLb(); return; }
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft')  goPrev();
});
lb.addEventListener('touchstart', e => {
  touchStartX    = e.changedTouches[0].clientX;
  touchStartY    = e.changedTouches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });
lb.addEventListener('touchend', e => {
  const dx  = e.changedTouches[0].clientX - touchStartX;
  const dy  = e.changedTouches[0].clientY - touchStartY;
  const dt  = Date.now() - touchStartTime;
  const vel = Math.abs(dx) / dt;
  const isH = Math.abs(dx) > Math.abs(dy);

  if (!isH && dy > 72)                          { closeLb(); return; }
  if (isH && (Math.abs(dx) > 50 || vel > 0.3)) { dx < 0 ? goNext() : goPrev(); }
}, { passive: true });

load();
</script>
</body>
