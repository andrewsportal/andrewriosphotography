<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Andrew Rios Photography</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gap: 1px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --safe-left: env(safe-area-inset-left);
    --safe-right: env(safe-area-inset-right);
  }

  html {
    background: #000;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  body {
    background: #000;
    overflow-x: hidden;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
  }

  /* ── HEADER ── */
  header {
    padding-top: calc(var(--safe-top) + 18px);
    padding-bottom: 14px;
    padding-left: calc(var(--safe-left) + 16px);
    padding-right: calc(var(--safe-right) + 16px);
    background: #000;
  }

  header h1 {
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: #fff;
    line-height: 1;
  }

  /* ── MASONRY GRID ── */
  #grid {
    display: flex;
    gap: var(--gap);
    padding: var(--gap);
    padding-left: calc(var(--safe-left) + var(--gap));
    padding-right: calc(var(--safe-right) + var(--gap));
    align-items: flex-start;
    width: 100%;
  }

  .col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .grid-item {
    width: 100%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overflow: hidden;
    background: #111;
  }

  .grid-item img {
    width: 100%;
    height: auto;
    display: block;
    will-change: transform;
  }

  .grid-item:active img {
    opacity: 0.82;
    transition: opacity 0.08s ease;
  }

  @media (hover: hover) {
    .grid-item:hover img {
      transform: scale(1.015);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .grid-item { animation: fadeUp 0.35s ease both; }

  /* ── BOTTOM BAR ── */
  #bottomBar {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 32px 20px;
    padding-bottom: calc(var(--safe-bottom) + 32px);
  }

  /* Page dots */
  #pageIndicator {
    display: flex;
    gap: 5px;
    align-items: center;
    height: 8px;
  }

  .page-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    flex-shrink: 0;
    transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .page-dot.active {
    background: #fff;
    width: 20px;
    border-radius: 3px;
  }

  /* Load more pill */
  #loadMoreBtn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 44px;
    padding: 0 22px;
    border-radius: 22px;
    border: none;
    background: rgba(255,255,255,0.1);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    color: rgba(255,255,255,0.82);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.1px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
  }

  #loadMoreBtn.visible { display: flex; }

  #loadMoreBtn:active {
    background: rgba(255,255,255,0.18);
    transform: scale(0.97);
  }

  #loadMoreBtn.loading { opacity: 0.45; pointer-events: none; }

  /* Back to top pill — shown when all loaded */
  #backTopBtn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 44px;
    padding: 0 22px;
    border-radius: 22px;
    border: none;
    background: rgba(255,255,255,0.08);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    color: rgba(255,255,255,0.5);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.1px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease, transform 0.12s ease;
  }

  #backTopBtn.visible { display: flex; }

  #backTopBtn:active {
    background: rgba(255,255,255,0.14);
    transform: scale(0.97);
  }

  /* ── FOOTER ── */
  footer {
    padding: 14px 20px;
    padding-bottom: calc(var(--safe-bottom) + 16px);
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  footer span {
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.07em;
    color: rgba(255,255,255,0.16);
    text-transform: uppercase;
  }

  /* ── LIGHTBOX ── */
  .lb {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    touch-action: none;
    user-select: none;
  }

  .lb.open {
    opacity: 1;
    pointer-events: all;
  }

  .lb-slot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.22s ease;
  }

  .lb-slot.hidden  { opacity: 0; pointer-events: none; }
  .lb-slot.visible { opacity: 1; }

  .lb-slot img {
    max-width: 100%;
    max-height: 100dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
  }

  /* HIG close — 44×44pt hit area */
  .lb-close {
    position: absolute;
    top: calc(var(--safe-top) + 14px);
    right: calc(var(--safe-right) + 16px);
    z-index: 10;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(60,60,67,0.65);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    padding: 7px;
    margin: -7px;
    font-family: -apple-system, sans-serif;
    transition: background 0.12s ease, transform 0.1s ease;
  }

  .lb-close:active {
    background: rgba(60,60,67,0.9);
    transform: scale(0.93);
  }

  /* Invisible 30% nav zones */
  .lb-prev, .lb-next {
    position: absolute;
    top: 0; bottom: 0;
    width: 30%;
    z-index: 8;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    pointer-events: none;
  }

  .lb.open .lb-prev,
  .lb.open .lb-next { pointer-events: all; }

  .lb-prev { left: 0; }
  .lb-next { right: 0; }

  /* HIG page dots */
  .lb-dots {
    position: absolute;
    bottom: calc(var(--safe-bottom) + 22px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }

  .lb-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex-shrink: 0;
  }

  .lb-dot.active {
    background: #fff;
    width: 18px;
    border-radius: 3px;
  }
</style>
</head>
<body>

<header>
  <h1>Andrew Rios</h1>
</header>

<main id="grid"></main>

<div id="bottomBar">
  <div id="pageIndicator"></div>
  <button id="loadMoreBtn" aria-label="Load more photos">
    More ↓
  </button>
  <button id="backTopBtn" aria-label="Back to top">
    ↑ Back to top
  </button>
</div>

<footer>
  <span>©2026 | Andrew Rios Photography</span>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <div class="lb-slot visible" id="slotA"><img id="imgA" src="" alt="" /></div>
  <div class="lb-slot hidden"  id="slotB"><img id="imgB" src="" alt="" /></div>
  <button class="lb-prev" id="lbPrev" aria-label="Previous photo"></button>
  <button class="lb-next" id="lbNext" aria-label="Next photo"></button>
  <div class="lb-dots" id="lbDots" aria-hidden="true"></div>
</div>

<script>
const GITHUB_USER   = 'andrewsportal';
const GITHUB_REPO   = 'andrewriosphotography';
const GITHUB_FOLDER = '';
const PAGE_SIZE     = 12;

const EXTS = ['jpg','jpeg','png','webp','heic'];
const RAW  = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;
const API  = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

let photos       = [];
let visibleCount = 0;
let current      = 0;
let activeSlot   = 'A';
let isLoading    = false; // prevent double-render on load more
let appLoaded    = false; // prevent double-init

// DOM refs
const gridEl      = document.getElementById('grid');
const lb          = document.getElementById('lb');
const slotA       = document.getElementById('slotA');
const slotB       = document.getElementById('slotB');
const imgA        = document.getElementById('imgA');
const imgB        = document.getElementById('imgB');
const dotsEl      = document.getElementById('lbDots');
const loadMoreBtn = document.getElementById('loadMoreBtn');
const backTopBtn  = document.getElementById('backTopBtn');
const pageIndEl   = document.getElementById('pageIndicator');

// Persistent column refs — created once, appended to across pages
let colL, colR, colHeights;

let touchStartX, touchStartY, touchStartTime;

/* ── INIT ── */
async function load() {
  if (appLoaded) return;
  appLoaded = true;

  try {
    const folder = GITHUB_FOLDER ? `/${GITHUB_FOLDER}` : '';
    const [filesRes, orderRes] = await Promise.all([
      fetch(`${API}${folder}`, { headers: { Accept: 'application/vnd.github.v3+json' } }),
      fetch(`${RAW}${GITHUB_FOLDER ? '/'+GITHUB_FOLDER : ''}/order.txt`).catch(() => null)
    ]);

    const files = await filesRes.json();
    if (!Array.isArray(files)) { console.error('GitHub API error', files); return; }

    // Build fileMap keyed by lowercase name to catch any case mismatches
    // Exclude non-image files (order.txt etc.) explicitly
    const fileMap = {};
    files
      .filter(f => f.type === 'file' && EXTS.some(e => f.name.toLowerCase().endsWith('.' + e)))
      .forEach(f => { fileMap[f.name.toLowerCase()] = { name: f.name, url: f.download_url }; });

    let ordered = [];
    const seen = new Set(); // dedupe guard — never add same file twice

    if (orderRes && orderRes.ok) {
      const text = await orderRes.text();
      text.split('\n')
        .map(l => l.trim())
        .filter(l => l && !l.startsWith('#'))
        .forEach(name => {
          const key = name.toLowerCase();
          if (fileMap[key] && !seen.has(key)) {
            seen.add(key);
            ordered.push({ thumb: `${RAW}/${fileMap[key].name}`, full: fileMap[key].url });
            delete fileMap[key];
          }
        });
    }
    // Append anything not in order.txt, alphabetically, no dupes
    Object.keys(fileMap).sort().forEach(key => {
      if (!seen.has(key)) {
        seen.add(key);
        ordered.push({ thumb: `${RAW}/${fileMap[key].name}`, full: fileMap[key].url });
      }
    });

    photos = ordered;

    // Create columns ONCE here — never recreated
    colL = document.createElement('div');
    colR = document.createElement('div');
    colL.className = 'col';
    colR.className = 'col';
    colHeights = [0, 0];
    gridEl.appendChild(colL);
    gridEl.appendChild(colR);

    await appendPhotos(0, PAGE_SIZE);
    visibleCount = Math.min(PAGE_SIZE, photos.length);

    buildLbDots();
    updateBottomBar();

  } catch(e) {
    console.error('Load error:', e);
  }
}

/* ── APPEND — adds a slice to the existing columns, never recreates them ── */
async function appendPhotos(from, count) {
  const to    = Math.min(from + count, photos.length);
  const slice = photos.slice(from, to);

  if (!slice.length) return;

  const ratios = await Promise.all(slice.map(p => probeRatio(p.thumb)));

  slice.forEach((p, idx) => {
    const globalIdx = from + idx;
    const col = colHeights[0] <= colHeights[1] ? 0 : 1;
    const item = makeItem(p, globalIdx, idx);
    (col === 0 ? colL : colR).appendChild(item);
    colHeights[col] += ratios[idx];
  });
}

function probeRatio(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => resolve(img.naturalHeight / Math.max(img.naturalWidth, 1));
    img.onerror = () => resolve(1);
    img.src = src;
  });
}

function makeItem(p, globalIdx, localIdx) {
  const div = document.createElement('div');
  div.className = 'grid-item';
  div.style.animationDelay = `${Math.min(localIdx, 8) * 0.04}s`;
  div.setAttribute('role', 'button');
  div.setAttribute('tabindex', '0');
  div.setAttribute('aria-label', `Photo ${globalIdx + 1}`);

  const img = document.createElement('img');
  img.src      = p.thumb;
  img.loading  = globalIdx < 8 ? 'eager' : 'lazy';
  img.decoding = 'async';
  img.alt      = '';

  div.appendChild(img);
  div.addEventListener('click', () => openLb(globalIdx));
  div.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') openLb(globalIdx);
  });
  return div;
}

/* ── BOTTOM BAR ── */
function updateBottomBar() {
  const remaining  = photos.length - visibleCount;
  const totalPages = Math.ceil(photos.length / PAGE_SIZE);
  const curPage    = Math.ceil(visibleCount / PAGE_SIZE);

  // Page dots — up to 9 pages
  pageIndEl.innerHTML = '';
  if (totalPages > 1 && totalPages <= 9) {
    for (let i = 0; i < totalPages; i++) {
      const d = document.createElement('div');
      d.className = 'page-dot' + (i === curPage - 1 ? ' active' : '');
      pageIndEl.appendChild(d);
    }
  }

  if (remaining > 0) {
    loadMoreBtn.textContent = `${remaining} more ↓`;
    loadMoreBtn.classList.add('visible');
    backTopBtn.classList.remove('visible');
  } else {
    loadMoreBtn.classList.remove('visible');
    backTopBtn.classList.add('visible');
  }
}

loadMoreBtn.addEventListener('click', async () => {
  if (isLoading) return;
  isLoading = true;
  loadMoreBtn.classList.add('loading');

  const from = visibleCount;
  const next = Math.min(PAGE_SIZE, photos.length - from);
  await appendPhotos(from, next);
  visibleCount = Math.min(visibleCount + next, photos.length);

  loadMoreBtn.classList.remove('loading');
  isLoading = false;
  updateBottomBar();
});

backTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ── LIGHTBOX DOTS ── */
const MAX_DOTS = 7;

function buildLbDots() {
  dotsEl.innerHTML = '';
  const n = Math.min(photos.length, MAX_DOTS);
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'lb-dot';
    dotsEl.appendChild(d);
  }
  updateLbDots();
}

function updateLbDots() {
  const dots = [...dotsEl.querySelectorAll('.lb-dot')];
  if (!dots.length) return;
  const half  = Math.floor(MAX_DOTS / 2);
  const start = Math.max(0, Math.min(current - half, photos.length - MAX_DOTS));
  dots.forEach((d, i) => d.classList.toggle('active', start + i === current));
}

/* ── LIGHTBOX ── */
function openLb(i) {
  current = i;
  const img = activeSlot === 'A' ? imgA : imgB;
  img.src = photos[i].full;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  updateLbDots();
  preloadAdjacent();
}

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}

function goTo(i) {
  const target = Math.max(0, Math.min(i, photos.length - 1));
  if (target === current) return;

  const fromSlot = activeSlot === 'A' ? slotA : slotB;
  const toSlot   = activeSlot === 'A' ? slotB : slotA;
  const toImg    = activeSlot === 'A' ? imgB  : imgA;

  current = target;
  toImg.src = '';
  toImg.src = photos[current].full;

  toImg.onload = () => {
    toSlot.classList.replace('hidden', 'visible');
    fromSlot.classList.replace('visible', 'hidden');
    activeSlot = activeSlot === 'A' ? 'B' : 'A';
    updateLbDots();
    preloadAdjacent();
  };
  toImg.onerror = () => { toImg.src = photos[current].thumb; };
}

function goNext() { goTo(current + 1); }
function goPrev() { goTo(current - 1); }

function preloadAdjacent() {
  [current + 1, current - 1]
    .filter(idx => idx >= 0 && idx < photos.length)
    .forEach(idx => { const p = new Image(); p.src = photos[idx].full; });
}

/* ── CONTROLS ── */
document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', goPrev);
document.getElementById('lbNext').addEventListener('click', goNext);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLb();
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft')  goPrev();
});

lb.addEventListener('touchstart', e => {
  touchStartX    = e.changedTouches[0].clientX;
  touchStartY    = e.changedTouches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });

lb.addEventListener('touchend', e => {
  const dx  = e.changedTouches[0].clientX - touchStartX;
  const dy  = e.changedTouches[0].clientY - touchStartY;
  const dt  = Date.now() - touchStartTime;
  const vel = Math.abs(dx) / dt;
  const isH = Math.abs(dx) > Math.abs(dy);

  if (!isH && dy > 72)                          { closeLb(); return; }
  if (isH && (Math.abs(dx) > 50 || vel > 0.3)) { dx < 0 ? goNext() : goPrev(); }
}, { passive: true });

load();
</script>
</body>
</html>
