<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Andrew Rios Photography</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root { --safe-bottom: env(safe-area-inset-bottom); }

  html, body {
    background: #000;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body { padding-bottom: calc(48px + var(--safe-bottom)); }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
    padding: 3px;
  }

  .grid-item:first-child                          { grid-column: 1 / -1; aspect-ratio: 4/3; }
  .grid-item:nth-child(7n+1):not(:first-child)    { grid-column: 1 / -1; aspect-ratio: 16/9; }

  .grid-item {
    aspect-ratio: 3/4;
    background: #111;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .grid-item img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.4s ease;
  }
  .grid-item:active img { transform: scale(0.97); }

  /* ── LIGHTBOX ── */
  .lb {
    position: fixed; inset: 0; z-index: 999;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .lb.open { opacity: 1; pointer-events: all; }

  .lb img {
    max-width: 100%; max-height: 100dvh;
    width: auto; height: auto;
    object-fit: contain; display: block;
    touch-action: pinch-zoom;
    transition: opacity 0.2s ease;
    user-select: none; -webkit-user-drag: none;
  }

  .lb-close {
    position: absolute; top: 0; right: 0;
    width: 72px; height: 72px;
    display: flex; align-items: flex-start; justify-content: flex-end;
    padding-top: calc(env(safe-area-inset-top) + 16px);
    padding-right: 20px;
    cursor: pointer; z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
  .lb-close::before {
    content: '✕';
    font-size: 18px; color: rgba(255,255,255,0.5);
    font-family: -apple-system, sans-serif;
  }

  footer {
    height: 48px;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: var(--safe-bottom);
    background: #000;
  }
  footer span {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 11px; font-weight: 300;
    letter-spacing: 0.08em; color: rgba(255,255,255,0.25);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<main class="grid" id="grid"></main>
<footer><span>©2026 | Andrew Rios Photography</span></footer>

<div class="lb" id="lb">
  <div class="lb-close" id="lbClose"></div>
  <img id="lbImg" src="" alt="" />
</div>

<script>
const GITHUB_USER   = 'andrewsportal';
const GITHUB_REPO   = 'andrewriosphotography';
const GITHUB_FOLDER = '';

const EXTS    = ['jpg','jpeg','png','webp','heic'];
const RAW     = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;
const API     = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

let photos  = [];
let current = 0;
let touchX  = 0;
let touchY  = 0;

const grid  = document.getElementById('grid');
const lb    = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');

/* ── LOAD ── */
async function load() {
  const folder = GITHUB_FOLDER ? `/${GITHUB_FOLDER}` : '';

  // Fetch file list and order.txt in parallel
  const [filesRes, orderRes] = await Promise.all([
    fetch(`${API}${folder}`, { headers: { Accept: 'application/vnd.github.v3+json' } }),
    fetch(`${RAW}${folder ? '/'+GITHUB_FOLDER : ''}/order.txt`).catch(() => null)
  ]);

  const files = await filesRes.json();

  // Build a map of filename → download_url
  const fileMap = {};
  files
    .filter(f => f.type === 'file' && EXTS.some(e => f.name.toLowerCase().endsWith('.' + e)))
    .forEach(f => { fileMap[f.name] = f.download_url; });

  let ordered = [];

  if (orderRes && orderRes.ok) {
    const text = await orderRes.text();
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

    // Photos listed in order.txt — in that order
    lines.forEach(name => {
      if (fileMap[name]) {
        ordered.push({ thumb: `${RAW}/${name}`, full: fileMap[name] });
        delete fileMap[name]; // remove so it doesn't appear twice
      }
    });
  }

  // Any remaining photos not in order.txt — appended alphabetically
  Object.keys(fileMap).sort().forEach(name => {
    ordered.push({ thumb: `${RAW}/${name}`, full: fileMap[name] });
  });

  photos = ordered;
  renderGrid();
}

function renderGrid() {
  photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'grid-item';
    const img = document.createElement('img');
    img.src = p.thumb;
    img.loading = i < 6 ? 'eager' : 'lazy';
    img.decoding = 'async';
    img.alt = '';
    div.appendChild(img);
    div.addEventListener('click', () => open(i));
    grid.appendChild(div);
  });
}

function open(i)  { current = i; showPhoto(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
function close()  { lb.classList.remove('open'); document.body.style.overflow = ''; }
function next()   { current = (current + 1) % photos.length; showPhoto(); }
function prev()   { current = (current - 1 + photos.length) % photos.length; showPhoto(); }

function showPhoto() {
  lbImg.style.opacity = '0';
  lbImg.src = photos[current].full;
  lbImg.onload  = () => { lbImg.style.opacity = '1'; };
  lbImg.onerror = () => { lbImg.src = photos[current].thumb; lbImg.style.opacity = '1'; };
}

document.getElementById('lbClose').addEventListener('click', close);

lb.addEventListener('click', e => {
  if (e.target.closest('#lbClose')) return;
  const x = e.clientX / window.innerWidth;
  if (x < 0.3) prev();
  else if (x > 0.7) next();
  else close();
});

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     close();
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft')  prev();
});

lb.addEventListener('touchstart', e => {
  touchX = e.changedTouches[0].clientX;
  touchY = e.changedTouches[0].clientY;
}, { passive: true });

lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 35) { dx < 0 ? next() : prev(); }
  else if (dy > 80 && Math.abs(dy) > Math.abs(dx))       { close(); }
}, { passive: true });

load();
</script>
</body>
</html>
