<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta property="og:url" content="https://andrewriosphotography.com/">

<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='32' y='41' font-family='-apple-system, sans-serif' font-size='24' font-weight='600' text-anchor='middle' fill='%23d4af37'%3EAR%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://wsrv.nl">

<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  button { font: inherit; }

  :root {
    --gap: 1px;
    --safe-top:    env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --safe-left:   env(safe-area-inset-left);
    --safe-right:  env(safe-area-inset-right);

    /* ── SPACING — 8px grid ── */
    --space-16: 16px;
    --space-24: 24px;
    --space-32: 32px;
    --space-48: 48px;
    --space-64: 64px;

    /* ── LOCKED DARK — always black regardless of system setting.
       Brand accents: forest-tinted fills, gold accent, teal detail border. ── */
    --color-bg:            #000000;
    --color-accent:        #d4af37;
    --color-grid-item-bg:  #131a16;
    --color-footer-border: rgba(103,150,143,0.38);
    --color-footer-text:   rgba(235,235,245,0.52);
    --color-btn-bg:        rgba(118,128,120,0.26);
    --color-btn-text:      rgba(240,244,240,0.85);
    --color-btn-bg-hover:  rgba(118,128,120,0.33);
    --color-btn-bg-active: rgba(118,128,120,0.42);
    --color-lb-bg:         #000000;
    --color-lb-close-bg:   rgba(58,66,61,0.62);
    --color-lb-close-text: rgba(255,255,255,0.92);
    --color-lb-dot:        rgba(255,255,255,0.32);
    --color-lb-dot-active: #ffffff;

    /* ── DYNAMIC TYPE — clamp(min, fluid, max) ── */
    --text-caption: clamp(0.6875rem, 2.5vw, 0.75rem);
    --text-body:    clamp(0.9375rem, 2.6vw, 1.0625rem);
  }

  html {
    background: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scrollbar-width: none;
  }

  html::-webkit-scrollbar { display: none; }

  body {
    background: var(--color-bg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    overflow-y: scroll;
  }

  /* ── MASONRY GRID ── */
  #grid {
    display: flex;
    gap: var(--gap);
    max-width: 1200px;
    margin: 0 auto;
    padding-top: calc(var(--safe-top) + var(--gap));
    padding-bottom: var(--gap);
    padding-left:  calc(var(--safe-left)  + var(--gap));
    padding-right: calc(var(--safe-right) + var(--gap));
    align-items: flex-start;
    width: 100%;
  }

  .col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .grid-item {
    width: 100%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overflow: hidden;
    background: var(--color-grid-item-bg);
  }

  .grid-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity 0.18s ease;
  }

  .grid-item:active img {
    opacity: 0.72;
  }

  /* ── BOTTOM BAR ── */
  #bottomBar {
    display: none;
    align-items: center;
    justify-content: center;
    padding: var(--space-32) var(--space-24) calc(var(--safe-bottom) + var(--space-24));
  }

  /* ── BACK TO TOP BUTTON ── */
  #backTopBtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 20px;
    border-radius: 22px;
    border: none;
    background: var(--color-btn-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.08),
                0 1px 6px rgba(0,0,0,0.22);
    color: var(--color-btn-text);
    font-size: var(--text-body);
    font-weight: 500;
    letter-spacing: -0.12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    transition: background 0.18s ease, box-shadow 0.18s ease;
  }

  /* ── HOVER — pointer devices only ── */
  @media (hover: hover) and (pointer: fine) {
    .grid-item:hover img {
      transform: scale(1.016);
    }

    #backTopBtn:hover {
      background: var(--color-btn-bg-hover);
      transform: translateY(-1px);
    }
  }

  #backTopBtn:active {
    background: var(--color-btn-bg-active);
    transform: scale(0.97);
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.06),
                0 1px 2px rgba(0,0,0,0.16);
  }

  /* ── FOOTER ── */
  footer {
    padding: var(--space-16) var(--space-24);
    padding-bottom: calc(var(--safe-bottom) + var(--space-24));
    display: none;
    align-items: center;
    justify-content: center;
    border-top: 0.5px solid var(--color-footer-border);
  }

  footer span {
    font-size: var(--text-caption);
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--color-footer-text);
  }

  /* ── LIGHTBOX ── */
  .lb {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: var(--color-lb-bg);
    opacity: 0;
    pointer-events: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .lb:focus { outline: none; }

  .lb.open {
    opacity: 1;
    pointer-events: all;
  }

  .lb-slot {
    position: absolute;
    top:    calc(var(--safe-top)    + var(--space-64));
    bottom: calc(var(--safe-bottom) + 56px);
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lb-slot.hidden  { opacity: 0; pointer-events: none; }
  .lb-slot.visible { opacity: 1; }

  .lb-slot img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  /* ── LIGHTBOX CLOSE ── */
  .lb-close {
    position: absolute;
    top:   calc(var(--safe-top)   + var(--space-16));
    right: calc(var(--safe-right) + var(--space-16));
    z-index: 10;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--color-lb-close-bg);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    backdrop-filter: saturate(180%) blur(24px);
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.12),
                0 2px 12px rgba(0,0,0,0.48),
                0 1px 3px  rgba(0,0,0,0.30);
    color: var(--color-lb-close-text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;
  }

  .lb-close::before {
    content: '';
    position: absolute;
    inset: -6px;
  }

  .lb-close svg { pointer-events: none; }

  .lb-close:active {
    transform: scale(0.90);
    background: rgba(76,86,80,0.68);
  }

  .lb-prev, .lb-next {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    z-index: 8;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    pointer-events: none;
  }

  .lb.open .lb-prev,
  .lb.open .lb-next { pointer-events: all; }

  .lb-prev { left: 0; }
  .lb-next { right: 0; }

  /* ── PAGE CONTROL DOTS ── */
  .lb-dots {
    position: absolute;
    bottom: calc(var(--safe-bottom) + var(--space-24));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }

  .lb-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-lb-dot);
    flex-shrink: 0;
  }

  .lb-dot.active {
    background: var(--color-lb-dot-active);
    width: 18px;
    border-radius: 3px;
  }

  /* ── FOCUS — visible keyboard focus, brand gold ── */
  #backTopBtn:focus-visible,
  .lb-close:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .grid-item:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: -2px;
  }

  .lb-prev:focus-visible,
  .lb-next:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: -6px;
  }

  /* ── MOTION — transforms animate only when the user allows it ── */
  @media (prefers-reduced-motion: no-preference) {
    .grid-item img {
      transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1),
                  opacity   0.18s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(7px) scale(0.984);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .grid-item.animate {
      animation: fadeIn 0.48s cubic-bezier(0.2, 0, 0, 1) both;
    }

    #backTopBtn {
      transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1),
                  background 0.18s ease,
                  box-shadow 0.18s ease;
    }

    .lb {
      transition: opacity 0.28s cubic-bezier(0.2, 0, 0, 1);
    }

    .lb-slot {
      transition: opacity 0.22s cubic-bezier(0.2, 0, 0.2, 1);
    }

    .lb-close {
      transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1),
                  background 0.15s ease;
    }

    .lb-dot {
      transition: width 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-radius 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background 0.26s ease;
    }
  }

  /* ── DESKTOP — layered over the mobile-first base ── */
  @media (min-width: 768px) {
    :root { --gap: 2px; }

    #bottomBar {
      padding: var(--space-48) var(--space-24) calc(var(--safe-bottom) + var(--space-32));
    }

    footer {
      padding-bottom: calc(var(--safe-bottom) + var(--space-32));
    }
  }

  @media (min-width: 1024px) {
    #bottomBar { padding-top: var(--space-64); }
  }
</style>
</head>

<body>

<main id="grid" role="main"></main>

<div id="bottomBar">
  <button id="backTopBtn" aria-label="Scroll back to top">
    Back to top
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</div>

<footer role="contentinfo">
  <span>© 2026 Andrew Rios Photography</span>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" tabindex="-1">
  <button class="lb-close" id="lbClose" aria-label="Close photo viewer">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l14 14M15 1L1 15"/>
    </svg>
  </button>

  <div class="lb-slot visible" id="slotA">
    <img id="imgA" src="" alt="" />
  </div>

  <div class="lb-slot hidden" id="slotB">
    <img id="imgB" src="" alt="" />
  </div>

  <button class="lb-prev" id="lbPrev" aria-label="Previous photo"></button>
  <button class="lb-next" id="lbNext" aria-label="Next photo"></button>

  <div class="lb-dots" id="lbDots" aria-hidden="true"></div>
</div>

<script>
const GITHUB_USER   = 'andrewsportal';
const GITHUB_REPO   = 'andrewriosphotography';
const GITHUB_FOLDER = '';

const EXTS = ['jpg','jpeg','png','webp','heic'];
const RAW  = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;
const API  = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let photos     = [];
let current    = 0;
let activeSlot = 'A';
let appLoaded  = false;

const gridEl     = document.getElementById('grid');
const lb         = document.getElementById('lb');
const slotA      = document.getElementById('slotA');
const slotB      = document.getElementById('slotB');
const imgA       = document.getElementById('imgA');
const imgB       = document.getElementById('imgB');
const dotsEl     = document.getElementById('lbDots');
const backTopBtn = document.getElementById('backTopBtn');

let cols = [];
let colHeights = [];
const itemEls = [];

let lastFocused = null;
let touchStartX, touchStartY, touchStartTime;

/* ── RESPONSIVE COLUMNS — 2 on phones, 3 from 768px up; same order, same count ── */
const mqDesktop = window.matchMedia('(min-width: 768px)');

function layoutGrid() {
  const n = mqDesktop.matches ? 3 : 2;

  if (cols.length === n) return;

  cols = [];
  colHeights = [];
  gridEl.textContent = '';

  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'col';

    cols.push(c);
    colHeights.push(0);
    gridEl.appendChild(c);
  }

  itemEls.forEach(el => placeItem(el));
}

/* ── SHORTEST-COLUMN PLACEMENT — balance height, not count ── */
function shortestCol() {
  let k = 0;

  for (let i = 1; i < colHeights.length; i++) {
    if (colHeights[i] < colHeights[k]) k = i;
  }

  return k;
}

function placeItem(el) {
  const k = shortestCol();

  cols[k].appendChild(el);
  colHeights[k] += parseFloat(el.dataset.ratio) || 1;
}

/* ── RATIO PROBE — tiny 100px proxy image, just to learn each photo's shape ── */
function loadRatio(url) {
  return new Promise(resolve => {
    const im = new Image();

    im.onload = () => resolve(
      im.naturalWidth
        ? im.naturalHeight / im.naturalWidth
        : 1
    );

    im.onerror = () => resolve(1);
    im.src = url;
  });
}

/* ── HELPER: PROXY URL GENERATOR ── */
function getProxyUrl(rawUrl, width) {
  const cleanUrl = rawUrl.replace(/^https?:\/\//, '');

  return `https://wsrv.nl/?url=${encodeURIComponent(cleanUrl)}&w=${width}&output=webp`;
}

/* ── LOAD ── */
async function load() {
  if (appLoaded) return;

  appLoaded = true;

  try {
    const folder = GITHUB_FOLDER ? `/${GITHUB_FOLDER}` : '';

    const [filesRes, orderRes] = await Promise.all([
      fetch(`${API}${folder}`, {
        headers: {
          Accept: 'application/vnd.github.v3+json'
        }
      }),

      fetch(
        `${RAW}${GITHUB_FOLDER ? '/' + GITHUB_FOLDER : ''}/order.txt`
      ).catch(() => null)
    ]);

    const files = await filesRes.json();

    if (!Array.isArray(files)) {
      console.error('GitHub API error', files);
      return;
    }

    const fileMap = {};

    files
      .filter(
        f =>
          f.type === 'file' &&
          EXTS.some(
            e => f.name.toLowerCase().endsWith('.' + e)
          )
      )
      .forEach(f => {
        fileMap[f.name.toLowerCase()] = f.name;
      });

    const stemMap = {};

    Object.keys(fileMap).forEach(key => {
      const stem = key.replace(/\.[^.]+$/, '');

      if (!stemMap[stem]) {
        stemMap[stem] = key;
      }
    });

    let ordered = [];
    const seen = new Set();

    if (orderRes && orderRes.ok) {
      const text = await orderRes.text();

      text
        .split('\n')
        .map(l => l.trim())
        .filter(l => l && !l.startsWith('#'))
        .forEach(name => {
          const stem = name
            .toLowerCase()
            .replace(/\.[^.]+$/, '');

          const key = stemMap[stem];

          if (key && !seen.has(key)) {
            seen.add(key);

            const rawImgUrl = `${RAW}/${fileMap[key]}`;

            ordered.push({
              probe: getProxyUrl(rawImgUrl, 100),
              thumb: getProxyUrl(rawImgUrl, 600),
              full:  getProxyUrl(rawImgUrl, 1600)
            });

            delete fileMap[key];
            delete stemMap[stem];
          }
        });
    }

    Object.keys(fileMap).sort().forEach(key => {
      if (!seen.has(key)) {
        seen.add(key);

        const rawImgUrl = `${RAW}/${fileMap[key]}`;

        ordered.push({
          probe: getProxyUrl(rawImgUrl, 100),
          thumb: getProxyUrl(rawImgUrl, 600),
          full:  getProxyUrl(rawImgUrl, 1600)
        });
      }
    });

    photos = ordered;

    layoutGrid();
    await appendPhotos(0, photos.length);
    buildLbDots();

    document.getElementById('bottomBar').style.display = 'flex';
    document.querySelector('footer').style.display = 'flex';

  } catch (e) {
    console.error('Load error:', e);
  }
}

/* ── APPEND — probes load in parallel, photos placed in order into the shortest column ── */
async function appendPhotos(from, count) {
  const to = Math.min(from + count, photos.length);
  const slice = photos.slice(from, to);

  if (!slice.length) return;

  const ratios = slice.map(p => loadRatio(p.probe));

  const guard = ms =>
    new Promise(r =>
      setTimeout(() => r(null), ms)
    );

  for (let idx = 0; idx < slice.length; idx++) {
    const globalIdx = from + idx;

    const ratio = (
      await Promise.race([
        ratios[idx],
        guard(5000)
      ])
    ) ?? 1;

    const item = makeItem(
      slice[idx],
      globalIdx,
      idx
    );

    item.dataset.ratio = ratio;

    itemEls.push(item);
    placeItem(item);
  }
}

function makeItem(p, globalIdx, localIdx) {
  const div = document.createElement('div');

  div.className = 'grid-item';

  if (!reduceMotion && localIdx < 12) {
    div.classList.add('animate');
    div.style.animationDelay = `${localIdx * 0.03}s`;
  }

  div.setAttribute('role', 'button');
  div.setAttribute('tabindex', '0');
  div.setAttribute(
    'aria-label',
    `Open photo ${globalIdx + 1} of ${photos.length}`
  );

  const img = document.createElement('img');

  img.src = p.thumb;
  img.loading = globalIdx < 6 ? 'eager' : 'lazy';
  img.decoding = 'async';
  img.alt = `Photo ${globalIdx + 1}`;

  div.appendChild(img);

  div.addEventListener(
    'click',
    () => openLb(globalIdx)
  );

  div.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openLb(globalIdx);
    }
  });

  return div;
}

/* ── BACK TO TOP ── */
backTopBtn.addEventListener('click', () => {
  window.scrollTo({
    top: 0,
    behavior: reduceMotion ? 'instant' : 'smooth'
  });
});

/* ── LIGHTBOX DOTS ── */
const MAX_DOTS = 7;

function buildLbDots() {
  dotsEl.innerHTML = '';

  const n = Math.min(photos.length, MAX_DOTS);

  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');

    d.className = 'lb-dot';
    dotsEl.appendChild(d);
  }

  updateLbDots();
}

function updateLbDots() {
  const dots = [
    ...dotsEl.querySelectorAll('.lb-dot')
  ];

  if (!dots.length) return;

  const half = Math.floor(MAX_DOTS / 2);

  const start = Math.max(
    0,
    Math.min(
      current - half,
      photos.length - MAX_DOTS
    )
  );

  dots.forEach((d, i) =>
    d.classList.toggle(
      'active',
      start + i === current
    )
  );
}

/* ── LIGHTBOX ── */
function openLb(i) {
  current = i;

  const img = activeSlot === 'A' ? imgA : imgB;

  img.src = photos[i].thumb;
  img.alt = `Photo ${i + 1} of ${photos.length}`;

  lastFocused = document.activeElement;

  lb.classList.add('open');
  document.body.style.overflow = 'hidden';

  lb.focus();

  updateLbDots();
  preloadAdjacent();

  const highResImg = new Image();

  highResImg.onload = () => {
    if (current === i) {
      img.src = photos[i].full;
    }
  };

  highResImg.src = photos[i].full;
}

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';

  if (lastFocused && lastFocused.focus) {
    lastFocused.focus();
  }
}

function goTo(i) {
  const target = Math.max(
    0,
    Math.min(i, photos.length - 1)
  );

  if (target === current) return;

  const fromSlot = activeSlot === 'A' ? slotA : slotB;
  const toSlot   = activeSlot === 'A' ? slotB : slotA;
  const toImg    = activeSlot === 'A' ? imgB : imgA;

  current = target;

  toImg.src = photos[current].thumb;
  toImg.alt = `Photo ${current + 1} of ${photos.length}`;

  toSlot.classList.replace('hidden', 'visible');
  fromSlot.classList.replace('visible', 'hidden');

  activeSlot = activeSlot === 'A' ? 'B' : 'A';

  updateLbDots();
  preloadAdjacent();

  const highResImg = new Image();

  highResImg.onload = () => {
    if (current === target) {
      toImg.src = photos[current].full;
    }
  };

  highResImg.src = photos[current].full;
}

function goNext() {
  goTo(current + 1);
}

function goPrev() {
  goTo(current - 1);
}

function preloadAdjacent() {
  [current + 1, current - 1]
    .filter(
      idx =>
        idx >= 0 &&
        idx < photos.length
    )
    .forEach(idx => {
      const p = new Image();
      p.src = photos[idx].full;
    });
}

/* ── CONTROLS ── */
document
  .getElementById('lbClose')
  .addEventListener('click', closeLb);

document
  .getElementById('lbPrev')
  .addEventListener('click', goPrev);

document
  .getElementById('lbNext')
  .addEventListener('click', goNext);

lb.addEventListener('click', e => {
  if (e.target === lb) {
    closeLb();
  }
});

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;

  if (e.key === 'Escape') {
    closeLb();
    return;
  }

  if (e.key === 'ArrowRight') {
    goNext();
  }

  if (e.key === 'ArrowLeft') {
    goPrev();
  }
});

lb.addEventListener(
  'touchstart',
  e => {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
    touchStartTime = Date.now();
  },
  { passive: true }
);

lb.addEventListener(
  'touchend',
  e => {
    const dx =
      e.changedTouches[0].clientX -
      touchStartX;

    const dy =
      e.changedTouches[0].clientY -
      touchStartY;

    const dt =
      Date.now() -
      touchStartTime;

    const vel =
      Math.abs(dx) / dt;

    const isH =
      Math.abs(dx) >
      Math.abs(dy);

    if (!isH && dy > 72) {
      closeLb();
      return;
    }

    if (
      isH &&
      (
        Math.abs(dx) > 50 ||
        vel > 0.3
      )
    ) {
      dx < 0
        ? goNext()
        : goPrev();
    }
  },
  { passive: true }
);

if (mqDesktop.addEventListener) {
  mqDesktop.addEventListener(
    'change',
    layoutGrid
  );
} else {
  mqDesktop.addListener(
    layoutGrid
  );
}

load();
</script>
