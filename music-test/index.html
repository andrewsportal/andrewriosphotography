<html lang="en">
<head>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  button { font: inherit; }

  /* the hidden attribute always wins, even over a class that sets display (Try Again is a .pill) */
  [hidden] { display: none !important; }

  /* selected text is grey too, not the system's blue */
  ::selection { background: rgba(255,255,255,0.3); color: #fff; }

  :root {
    --gap: 1px;
    --safe-top:    env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --safe-left:   env(safe-area-inset-left);
    --safe-right:  env(safe-area-inset-right);

    /* ── SPACING — 8px grid ── */
    --space-16: 16px;
    --space-24: 24px;
    --space-32: 32px;
    --space-48: 48px;
    --space-64: 64px;

    /* ── LOCKED DARK — always black regardless of system setting.
       No colour anywhere: white, greys and black only, so the photos carry all of it. ── */
    --color-bg:            #000000;
    --color-focus:         rgba(255,255,255,0.92);
    --color-grid-item-bg:  #181818;
    /* 7:1 on black, the Dark Mode aim for small custom-coloured text */
    --color-footer-text:   rgba(255,255,255,0.6);
    --color-btn-bg:        rgba(124,124,124,0.26);
    --color-btn-text:      rgba(255,255,255,0.85);
    --color-btn-bg-hover:  rgba(124,124,124,0.33);
    --color-btn-bg-active: rgba(124,124,124,0.42);
    --color-lb-bg:         #000000;
    --color-lb-close-bg:   rgba(63,63,63,0.62);
    --color-lb-close-text: rgba(255,255,255,0.92);
    --color-lb-dot:        rgba(255,255,255,0.32);
    --color-lb-dot-active: #ffffff;

    /* ── TYPE — Caption 1 12pt and Body 17pt, the iOS defaults; iPhone and iPad scale them below ── */
    --text-caption: 0.75rem;
    --text-body:    1.0625rem;

    /* dark scroll indicators to match the page */
    color-scheme: dark;
  }

  html {
    background: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    background: var(--color-bg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    overflow-y: scroll;
  }

  /* ── MASONRY GRID — the columns are empty rulers; the script sets each photo over its column ── */
  #grid {
    position: relative;
    display: flex;
    gap: var(--gap);
    margin: 0 auto;
    padding-top: calc(var(--safe-top) + var(--gap));
    padding-bottom: var(--gap);
    padding-left:  calc(var(--safe-left)  + var(--gap));
    padding-right: calc(var(--safe-right) + var(--gap));
    align-items: flex-start;
    width: 100%;
  }

  .col {
    flex: 1 1 0;
    min-width: 0;
  }

  .grid-item {
    position: absolute;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overflow: hidden;
    background: var(--color-grid-item-bg);
  }

  .grid-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity 0.18s ease;
  }

  .grid-item:active img {
    opacity: 0.72;
  }

  /* ── BOTTOM BAR ── */
  #bottomBar {
    display: none;
    align-items: center;
    justify-content: center;
    /* top matches the gap below the button (its 24 plus the footer's 16), less the grid's bottom gap */
    padding: calc(var(--space-24) + var(--space-16) - var(--gap)) var(--space-24) var(--space-24);
  }

  /* ── PILL BUTTON — Back to top, Try Again ── */
  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 20px;
    border-radius: 22px;
    border: none;
    background: var(--color-btn-bg);
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.08),
                0 1px 6px rgba(0,0,0,0.22);
    color: var(--color-btn-text);
    font-size: var(--text-body);
    font-weight: 500;
    letter-spacing: -0.12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    transition: background 0.18s ease, box-shadow 0.18s ease;
  }

  /* the arrowhead is sized in em, as Apple sizes symbols beside text: it matches the label, its strokes as thick
     as the letters, and it grows with the reader's text size */
  .pill svg {
    width: 0.76em;
    height: 0.46em;
    flex: none;
  }

  /* ── HOVER — pointer devices only ── */
  @media (hover: hover) and (pointer: fine) {
    .grid-item:hover img {
      transform: scale(1.016);
    }

    .pill:hover {
      background: var(--color-btn-bg-hover);
      transform: translateY(-1px);
    }
  }

  .pill:active {
    background: var(--color-btn-bg-active);
    transform: scale(0.97);
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.06),
                0 1px 2px rgba(0,0,0,0.16);
  }

  /* ── STATUS — loading spinner, then an error with Try Again if GitHub doesn't answer ── */
  .status {
    position: fixed;
    inset: 0;
    display: none;
    pointer-events: none;  /* photos arriving underneath stay tappable; only Try Again takes a tap */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-16);
    padding: var(--space-24);
    text-align: center;
  }

  .status.loading,
  .status.error { display: flex; }

  .status .pill { pointer-events: auto; }

  .status-text {
    max-width: 280px;
    font-size: var(--text-body);
    line-height: 1.35;
    color: var(--color-footer-text);
  }

  .status:not(.error) .status-text {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  .spinner {
    display: none;
    position: relative;
    width: 20px;
    height: 20px;
  }

  .status.loading .spinner { display: block; }

  .spinner i {
    position: absolute;
    left: 9px;
    top: 0;
    width: 2px;
    height: 6px;
    border-radius: 1px;
    background: rgba(255,255,255,0.56);
    transform-origin: 1px 10px;
    transform: rotate(calc(var(--i) * 45deg));
    animation: spinnerFade 0.8s linear infinite;
    animation-delay: calc(var(--i) * 0.1s - 0.8s);
  }

  @keyframes spinnerFade {
    from { opacity: 1; }
    to   { opacity: 0.15; }
  }

  /* ── FOOTER ── */
  footer {
    padding: var(--space-16) var(--space-24);
    padding-bottom: calc(var(--safe-bottom) + var(--space-24));
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  footer span {
    font-size: var(--text-caption);
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--color-footer-text);
  }

  /* ── LIGHTBOX ── */
  .lb {
    position: fixed;
    inset: 0;
    z-index: 999;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .lb:focus { outline: none; }

  .lb.open {
    opacity: 1;
    pointer-events: all;
  }

  .lb-backdrop {
    position: absolute;
    inset: 0;
    background: var(--color-lb-bg);
  }

  /* three slides (previous, current, next) that move with the finger */
  .lb-slide {
    position: absolute;
    inset: 0;
  }

  .lb-slide[hidden] { display: none; }

  /* the zoom layer covers the screen, so a zoomed photo can use all of it */
  .lb-zoom {
    position: absolute;
    inset: 0;
    padding: calc(var(--safe-top) + var(--space-64)) var(--safe-right) calc(var(--safe-bottom) + 56px) var(--safe-left);
    transform-origin: center;
  }

  .lb.zoomed .lb-zoom { cursor: grab; }

  .lb-zoom img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ── LIGHTBOX CLOSE ── */
  .lb-close {
    position: absolute;
    top:   calc(var(--safe-top)   + var(--space-16));
    right: calc(var(--safe-right) + var(--space-16));
    z-index: 10;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--color-lb-close-bg);
    -webkit-backdrop-filter: grayscale(1) blur(24px);
    backdrop-filter: grayscale(1) blur(24px);
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.12),
                0 2px 12px rgba(0,0,0,0.48),
                0 1px 3px  rgba(0,0,0,0.30);
    color: var(--color-lb-close-text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;
  }

  .lb-close::before {
    content: '';
    position: absolute;
    inset: -6px;
  }

  .lb-close svg { pointer-events: none; }

  .lb-close:active {
    transform: scale(0.90);
    background: rgba(82,82,82,0.68);
  }

  .lb-prev, .lb-next {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    z-index: 8;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    pointer-events: none;
  }

  .lb.open .lb-prev,
  .lb.open .lb-next { pointer-events: all; }

  .lb-prev { left: 0; }
  .lb-next { right: 0; }

  .lb.zoomed .lb-prev,
  .lb.zoomed .lb-next { display: none; }

  /* touch screens swipe instead; the buttons stay for VoiceOver */
  @media (hover: none), (pointer: coarse) {
    .lb-prev,
    .lb-next {
      top: 0;
      bottom: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
  }

  /* a tap hides the controls, as in Photos; dragging to close hides them too */
  .lb.bare .lb-close,
  .lb.bare .lb-dots,
  .lb.dragging .lb-close,
  .lb.dragging .lb-dots {
    opacity: 0;
    pointer-events: none;
  }

  /* ── PAGE CONTROL DOTS ── */
  .lb-dots {
    position: absolute;
    bottom: calc(var(--safe-bottom) + var(--space-24));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }

  .lb-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-lb-dot);
    flex-shrink: 0;
  }

  .lb-dot.active {
    background: var(--color-lb-dot-active);
    width: 18px;
    border-radius: 3px;
  }

  /* an end dot shrinks when more photos lie past it, as in iOS */
  .lb-dot.more { transform: scale(0.67); }

  /* ── FOCUS — visible keyboard focus, in white ── */
  .pill:focus-visible,
  .lb-close:focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: 2px;
  }

  .grid-item:focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: -2px;
  }

  /* a black edge inside the ring keeps it visible on white and pale photos */
  .grid-item:focus-visible::after {
    content: '';
    position: absolute;
    inset: 2px;
    box-shadow: inset 0 0 0 2px var(--color-bg);
    pointer-events: none;
  }

  .lb-prev:focus-visible,
  .lb-next:focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: -6px;
  }

  /* ── MOTION — transforms animate only when the user allows it ── */
  @media (prefers-reduced-motion: no-preference) {
    .grid-item img {
      transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1),
                  opacity   0.18s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(7px) scale(0.984);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .grid-item.animate {
      animation: fadeIn 0.48s cubic-bezier(0.2, 0, 0, 1) both;
    }

    .pill {
      transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1),
                  background 0.18s ease,
                  box-shadow 0.18s ease;
    }

    .lb {
      transition: opacity 0.28s cubic-bezier(0.2, 0, 0, 1);
    }

    .lb-close {
      transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1),
                  background 0.15s ease,
                  opacity 0.2s ease;
    }

    .lb-dots {
      transition: opacity 0.2s ease;
    }

    .lb-dot {
      transition: width 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-radius 0.26s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background 0.26s ease,
                  transform 0.26s ease;
    }
  }

  /* ── DYNAMIC TYPE — on iPhone and iPad, text follows the reader's text size setting ── */
  @supports (font: -apple-system-body) and (-webkit-touch-callout: none) {
    .pill        { font: -apple-system-body; font-weight: 500; }
    .status-text { font: -apple-system-body; }
    footer span  { font: -apple-system-caption1; }
  }

  /* ── DESKTOP — layered over the mobile-first base ── */
  @media (min-width: 768px) {
    :root { --gap: 2px; }

    #bottomBar {
      padding: calc(var(--space-32) + var(--space-16) - var(--gap)) var(--space-24) var(--space-32);
    }

    footer {
      padding-bottom: calc(var(--safe-bottom) + var(--space-32));
    }
  }
</style>
</head>

<body>

<main>
  <h1 class="sr-only">Andrew Rios Photography</h1>
  <div id="grid"></div>
</main>

<div class="status" id="status" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true">
    <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
    <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
  </div>
  <p class="status-text" id="statusText"></p>
  <button class="pill" id="retryBtn" hidden>Try Again</button>
</div>

<div id="bottomBar">
  <button class="pill" id="backTopBtn">
    Back to top
    <svg width="13" height="8" viewBox="0 0 13 8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="1.25 6.75 6.5 1.25 11.75 6.75"></polyline>
    </svg>
  </button>
</div>

<footer role="contentinfo">
  <span>© 2026 Andrew Rios Photography</span>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" tabindex="-1" inert>
  <div class="lb-backdrop" id="lbBackdrop"></div>

  <div id="lbTrack">
    <div class="lb-slide"><div class="lb-zoom"><img alt="" draggable="false"></div></div>
    <div class="lb-slide"><div class="lb-zoom"><img alt="" draggable="false"></div></div>
    <div class="lb-slide"><div class="lb-zoom"><img alt="" draggable="false"></div></div>
  </div>

  <button class="lb-close" id="lbClose" aria-label="Close photo viewer">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 1l14 14M15 1L1 15"/>
    </svg>
  </button>

  <button class="lb-prev" id="lbPrev" aria-label="Previous photo"></button>
  <button class="lb-next" id="lbNext" aria-label="Next photo"></button>

  <div class="lb-dots" id="lbDots" aria-hidden="true"></div>

  <p class="sr-only" id="lbStatus" aria-live="polite"></p>
</div>

<script>
const GITHUB_USER   = 'andrewsportal';
const GITHUB_REPO   = 'andrewriosphotography';
const GITHUB_FOLDER = '';

const EXTS = ['jpg','jpeg','png','webp','heic'];
const RAW  = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main`;
const API  = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let photos     = [];
let current    = 0;
let appLoaded  = false;

const gridEl     = document.getElementById('grid');
const lb         = document.getElementById('lb');
const dotsEl     = document.getElementById('lbDots');
const backTopBtn = document.getElementById('backTopBtn');

let cols = [];
let colHeights = [];
let colItems = [];  // the photos in each column, top to bottom
const itemEls = [];

let lastFocused = null;

/* ── RESPONSIVE COLUMNS — 2 on phones; from 768px up, as many ~400px columns as fit (3 to 6) ── */
const mqDesktop  = window.matchMedia('(min-width: 768px)');
const COL_TARGET = 400;

function colCount() {
  if (!mqDesktop.matches) return 2;

  return Math.min(6, Math.max(3, Math.round(window.innerWidth / COL_TARGET)));
}

function colSizes() {
  return `${Math.ceil(window.innerWidth / cols.length)}px`;
}

function layoutGrid() {
  const n = colCount();

  if (cols.length === n) return levelColumns();

  cols.forEach(c => reflow.unobserve(c));

  cols = [];
  colHeights = [];
  colItems = [];
  gridEl.textContent = '';

  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'col';

    cols.push(c);
    colHeights.push(0);
    colItems.push([]);
    gridEl.appendChild(c);
    reflow.observe(c);
  }

  const split = Math.max(0, itemEls.length - tailSize());

  itemEls.slice(0, split).forEach(el => placeItem(el));
  placeTail(itemEls.slice(split));
  levelColumns();

  const sizes = colSizes();
  itemEls.forEach(el => { el.querySelector('img').sizes = sizes; });
}

/* ── SHORTEST-COLUMN PLACEMENT — balance height, not count ── */
function shortestCol() {
  let k = 0;

  for (let i = 1; i < colHeights.length; i++) {
    if (colHeights[i] < colHeights[k]) k = i;
  }

  return k;
}

function placeItem(el) {
  const k = shortestCol();

  colItems[k].push(el);
  gridEl.appendChild(el);
  colHeights[k] += parseFloat(el.dataset.ratio) || 1;
}

/* ── LEVEL TAIL — the last photos are shared out so the columns end as close to level as possible ── */
const TAIL_PER_COL = 4;
const TAIL_TRIES   = 200;  // ~3ms even at 6 columns

function tailSize() {
  return TAIL_PER_COL * cols.length;
}

function placeTail(els) {
  const r = els.map(el => parseFloat(el.dataset.ratio) || 1);

  let seed = 7;  // fixed, so the same photos always land the same way
  const rand = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

  let best = [];
  let bestSpread = Infinity;

  for (let t = 0; t < TAIL_TRIES; t++) {
    const h = colHeights.slice();
    const at = [];
    const idx = [...r.keys()];

    // first try biggest first, then shuffled orders; each photo starts in the shortest column
    if (t === 0) {
      idx.sort((a, b) => r[b] - r[a]);
    } else {
      for (let i = idx.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [idx[i], idx[j]] = [idx[j], idx[i]];
      }
    }

    idx.forEach(i => {
      const k = h.indexOf(Math.min(...h));
      at[i] = k;
      h[k] += r[i];
    });

    settle(h, r, at);

    const spread = Math.max(...h) - Math.min(...h);

    if (spread < bestSpread) {
      best = at;
      bestSpread = spread;
    }
  }

  els.forEach((el, i) => {
    colItems[best[i]].push(el);
    gridEl.appendChild(el);
    colHeights[best[i]] += r[i];
  });
}

// move or swap photos between columns for as long as that flattens the heights (sum of squares falls)
function settle(h, r, at) {
  let improved = true;

  while (improved) {
    improved = false;

    for (let i = 0; i < r.length; i++) {
      for (let k = 0; k < h.length; k++) {
        const a = at[i];

        if (k !== a && r[i] * (h[k] - h[a] + r[i]) < -1e-9) {
          h[a] -= r[i];
          h[k] += r[i];
          at[i] = k;
          improved = true;
        }
      }

      for (let j = i + 1; j < r.length; j++) {
        const a = at[i];
        const b = at[j];
        const x = r[j] - r[i];

        if (a !== b && x * (h[a] - h[b] + x) < -1e-9) {
          h[a] += x;
          h[b] -= x;
          at[i] = b;
          at[j] = a;
          improved = true;
        }
      }
    }
  }
}

/* ── LEVEL COLUMNS — width each column so all end on one line, no cropping ── */
const MAX_WIDTH_SHIFT = 0.05;  // past ±5% the difference would show, so leave the ends uneven

function levelColumns() {
  const n = cols.length;
  const sums = colItems.map(items =>
    items.reduce((t, el) => t + (parseFloat(el.dataset.ratio) || 1), 0)
  );

  if (!n || sums.some(t => !t)) return positionItems();

  // a column of width w ends at w * sum + gap * (count - 1); solve for one shared end
  const cs = getComputedStyle(gridEl);
  const gap = parseFloat(cs.columnGap) || 0;
  const room = gridEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - gap * (n - 1);
  const gaps = colItems.map(items => gap * (items.length - 1));

  const end = (room + gaps.reduce((t, g, k) => t + g / sums[k], 0)) /
              sums.reduce((t, s) => t + 1 / s, 0);

  cols.forEach((c, k) => {
    const share = ((end - gaps[k]) / sums[k]) / (room / n);
    c.style.flexGrow = Math.min(1 + MAX_WIDTH_SHIFT, Math.max(1 - MAX_WIDTH_SHIFT, share));
  });

  positionItems();
}

/* ── POSITION — each photo is set over its column. In the page itself the photos run 1, 2, 3,
   so Tab and VoiceOver take them in viewing order rather than down one column, then the next ── */
function positionItems() {
  const box = gridEl.getBoundingClientRect();
  const cs = getComputedStyle(gridEl);
  const gap = parseFloat(cs.rowGap) || 0;
  const rulers = cols.map(c => c.getBoundingClientRect());

  // widths first, so the browser sizes each photo before they're stacked
  colItems.forEach((items, k) => items.forEach(el => {
    el.style.left = `${rulers[k].left - box.left}px`;
    el.style.width = `${rulers[k].width}px`;
  }));

  // computed height, which the fade-in's scale doesn't touch; it's printed to 3 decimals,
  // so put it back on the 1/64px grid browsers lay out on, or photos drift a fraction down each column
  const heights = colItems.map(items => items.map(el =>
    Math.round(parseFloat(getComputedStyle(el).height) * 64) / 64
  ));
  let end = 0;

  colItems.forEach((items, k) => {
    let y = parseFloat(cs.paddingTop);

    items.forEach((el, i) => {
      el.style.top = `${y}px`;
      y += heights[k][i] + gap;
    });

    end = Math.max(end, items.length ? y - gap : y);
  });

  gridEl.style.height = `${end + parseFloat(cs.paddingBottom)}px`;
}

// a column changing width, or a photo's true shape arriving, moves the photos before the next paint
const reflow = new ResizeObserver(() => positionItems());

/* ── RATIO PROBE — tiny 100px proxy image, just to learn the shape of a photo without web copies yet ── */
function loadRatio(url) {
  return new Promise(resolve => {
    const im = new Image();

    im.onload = () => resolve(
      im.naturalWidth
        ? im.naturalHeight / im.naturalWidth
        : 1
    );

    im.onerror = () => resolve(1);
    im.src = url;
  });
}

/* ── HELPER: PROXY URL GENERATOR ── */
const THUMB_WIDTHS = [400, 600, 800, 1000];

function getProxyUrl(rawUrl, width) {
  const cleanUrl = rawUrl.replace(/^https?:\/\//, '');

  return `https://wsrv.nl/?url=${encodeURIComponent(cleanUrl)}&w=${width}&output=webp`;
}

/* ── WEB COPIES — after each upload GitHub makes small copies of every photo (.github/workflows/web-copies.yml)
   and lists each one's shape in web/sizes.json. A listed photo loads straight from this site and is placed at once;
   any other, such as one uploaded a minute ago, goes through wsrv as before ── */
const WEB = 'web';

async function webSizes() {
  try {
    const res = await fetch(`${WEB}/sizes.json`, { cache: 'no-cache' });

    if (res.ok) return await res.json();
  } catch (e) {
    console.error('web/sizes.json unreadable', e);
  }

  return {};
}

function photoEntry(name, sizes) {
  const raw = `${RAW}/${name}`;
  const s = sizes[name];

  if (!s || !(s.w > 0 && s.h > 0 && s.v)) {
    return {
      probe:  getProxyUrl(raw, 100),
      raw,
      srcset: THUMB_WIDTHS.map(w => `${getProxyUrl(raw, w)} ${w}w`).join(', '),
      thumb:  getProxyUrl(raw, 600),
      full:   getProxyUrl(raw, 1600)
    };
  }

  // ?v= changes when the photo is replaced, so browsers drop the old copy
  const copy = w => `${WEB}/${encodeURIComponent(name)}-${w}.webp?v=${s.v}`;

  // a copy is never wider than its photo, so each size is listed at the width it really is
  const srcset = THUMB_WIDTHS
    .filter((w, i) => w < s.w || i === 0 || THUMB_WIDTHS[i - 1] < s.w)
    .map(w => `${copy(w)} ${Math.min(w, s.w)}w`)
    .join(', ');

  return {
    ratio: s.h / s.w,
    raw,
    srcset,
    thumb: copy(600),
    full:  copy(1600)
  };
}

/* ── LOAD ── */
async function load() {
  if (appLoaded) return;

  appLoaded = true;
  setStatus('loading');

  try {
    const [files, orderRes, sizes] = await Promise.all([
      listFiles(),

      // from this site, not GitHub, so it doesn't count against GitHub's limits
      fetch(
        `${GITHUB_FOLDER ? GITHUB_FOLDER + '/' : ''}order.txt`
      ).catch(() => null),

      webSizes()
    ]);

    if (!files) throw new Error('No file list from GitHub');

    const fileMap = {};

    files
      .filter(
        name =>
          EXTS.some(
            e => name.toLowerCase().endsWith('.' + e)
          )
      )
      .forEach(name => {
        fileMap[name.toLowerCase()] = name;
      });

    const stemMap = {};

    Object.keys(fileMap).forEach(key => {
      const stem = key.replace(/\.[^.]+$/, '');

      if (!stemMap[stem]) {
        stemMap[stem] = key;
      }
    });

    let ordered = [];
    const seen = new Set();

    if (orderRes && orderRes.ok) {
      const text = await orderRes.text();

      text
        .split('\n')
        .map(l => l.trim())
        .filter(l => l && !l.startsWith('#'))
        .forEach(name => {
          const stem = name
            .toLowerCase()
            .replace(/\.[^.]+$/, '');

          const key = stemMap[stem];

          if (key && !seen.has(key)) {
            seen.add(key);

            ordered.push(photoEntry(fileMap[key], sizes));

            delete fileMap[key];
            delete stemMap[stem];
          }
        });
    }

    Object.keys(fileMap).sort().forEach(key => {
      if (!seen.has(key)) {
        seen.add(key);

        ordered.push(photoEntry(fileMap[key], sizes));
      }
    });

    photos = ordered;

    layoutGrid();
    await appendPhotos(0, photos.length);
    buildLbDots();

    setStatus('');

    document.getElementById('bottomBar').style.display = 'flex';
    document.querySelector('footer').style.display = 'flex';

  } catch (e) {
    console.error('Load error:', e);

    appLoaded = false;
    setStatus('error');
  }
}

/* ── FILE LIST — GitHub Pages writes photos.json each time it builds the site, so visitors needn't ask
   GitHub's API, which allows 60 lookups an hour per network. The API, then the last good list, are fallbacks ── */
const FILES_KEY = 'arp-files';

async function listFiles() {
  const names = await siteFiles() || await apiFiles();

  if (names) {
    try { localStorage.setItem(FILES_KEY, JSON.stringify(names)); } catch (e) {}

    return names;
  }

  try {
    const saved = JSON.parse(localStorage.getItem(FILES_KEY));
    return Array.isArray(saved) ? saved : null;
  } catch (e) {
    return null;
  }
}

// photos.json lists every file in the site from its root ("/001.png", "/icons/favicon.svg"); keep the photo folder's own
async function siteFiles() {
  try {
    const res = await fetch('photos.json');
    const paths = await res.json();

    if (res.ok && Array.isArray(paths)) {
      const dir = GITHUB_FOLDER ? `/${GITHUB_FOLDER}/` : '/';

      return paths
        .filter(p => p.startsWith(dir) && !p.includes('/', dir.length))
        .map(p => p.slice(dir.length));
    }
  } catch (e) {
    console.error('photos.json unreadable', e);
  }

  return null;
}

async function apiFiles() {
  try {
    const res = await fetch(`${API}${GITHUB_FOLDER ? '/' + GITHUB_FOLDER : ''}`, {
      headers: {
        Accept: 'application/vnd.github.v3+json'
      }
    });

    const list = await res.json();

    if (res.ok && Array.isArray(list)) {
      return list.filter(f => f.type === 'file').map(f => f.name);
    }

    console.error('GitHub API error', list);
  } catch (e) {
    console.error('GitHub API unreachable', e);
  }

  return null;
}

/* ── STATUS — spinner only if loading takes a moment, so fast loads don't flash ── */
const statusEl   = document.getElementById('status');
const statusText = document.getElementById('statusText');
const retryBtn   = document.getElementById('retryBtn');

let statusTimer = 0;

function setStatus(state) {
  clearTimeout(statusTimer);

  statusEl.classList.remove('loading', 'error');
  retryBtn.hidden = true;

  if (state === 'loading') {
    statusText.textContent = 'Loading photos';
    statusTimer = setTimeout(() => statusEl.classList.add('loading'), 400);
  } else if (state === 'error') {
    statusText.textContent = 'Photos couldn\u2019t load. Check your connection and try again.';
    statusEl.classList.add('error');
    retryBtn.hidden = false;
  } else {
    statusText.textContent = '';
  }
}

retryBtn.addEventListener('click', load);

/* ── APPEND — probes load in parallel, photos placed in order into the shortest column ── */
async function appendPhotos(from, count) {
  const to = Math.min(from + count, photos.length);
  const slice = photos.slice(from, to);

  if (!slice.length) return;

  // a photo with web copies already knows its shape; any other is probed through wsrv
  const ratios = slice.map(p => p.ratio ? Promise.resolve(p.ratio) : loadRatio(p.probe));
  const tail = [];

  const guard = ms =>
    new Promise(r =>
      setTimeout(() => r(null), ms)
    );

  for (let idx = 0; idx < slice.length; idx++) {
    const globalIdx = from + idx;

    const ratio = (
      await Promise.race([
        ratios[idx],
        guard(5000)
      ])
    ) ?? 1;

    const item = makeItem(
      slice[idx],
      globalIdx,
      idx
    );

    item.dataset.ratio = ratio;
    // hold the photo's shape before it loads, so the page doesn't jump and lazy loading works
    item.querySelector('img').style.aspectRatio = `auto 1 / ${ratio}`;

    itemEls.push(item);

    if (globalIdx < photos.length - tailSize()) {
      placeItem(item);
      positionItems();
      setStatus('');  // once photos are arriving they show the progress, so the spinner goes
    } else {
      tail.push(item);
    }
  }

  placeTail(tail);
  levelColumns();
}

function makeItem(p, globalIdx, localIdx) {
  const div = document.createElement('div');

  div.className = 'grid-item';

  if (!reduceMotion && localIdx < 12) {
    div.classList.add('animate');
    div.style.animationDelay = `${localIdx * 0.03}s`;
  }

  // named by its photo's alt text: Photo 1, Photo 2
  div.setAttribute('role', 'button');
  div.setAttribute('tabindex', '0');

  const img = document.createElement('img');

  // the browser picks the width that's sharp for the column and screen: ~600 on phones, ~800 on retina laptops
  img.sizes = colSizes();
  img.srcset = p.srcset;
  img.src = p.thumb;
  img.loading = globalIdx < 6 ? 'eager' : 'lazy';
  img.decoding = 'async';
  img.alt = `Photo ${globalIdx + 1}`;

  div.appendChild(img);
  reflow.observe(img);

  // the drawn photo gives a truer shape than the 100px probe, so re-level once it's in
  // (its box, not naturalWidth: with srcset those are rounded to whole CSS pixels)
  img.addEventListener('load', () => {
    const box = img.getBoundingClientRect();

    if (!box.width || !box.height) return;

    div.dataset.ratio = box.height / box.width;
    levelColumns();
  });

  div.addEventListener(
    'click',
    () => openLb(globalIdx)
  );

  div.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openLb(globalIdx);
    }
  });

  return div;
}

/* ── BACK TO TOP ── */
backTopBtn.addEventListener('click', () => {
  window.scrollTo({
    top: 0,
    behavior: reduceMotion ? 'instant' : 'smooth'
  });
});

/* ── LIGHTBOX DOTS ── */
const MAX_DOTS = 7;

function buildLbDots() {
  dotsEl.innerHTML = '';

  const n = Math.min(photos.length, MAX_DOTS);

  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');

    d.className = 'lb-dot';
    dotsEl.appendChild(d);
  }

  updateLbDots();
}

function updateLbDots() {
  const dots = [
    ...dotsEl.querySelectorAll('.lb-dot')
  ];

  if (!dots.length) return;

  const half = Math.floor(MAX_DOTS / 2);

  const start = Math.max(
    0,
    Math.min(
      current - half,
      photos.length - MAX_DOTS
    )
  );

  dots.forEach((d, i) => {
    d.classList.toggle('active', start + i === current);
    d.classList.toggle(
      'more',
      (i === 0 && start > 0) ||
      (i === dots.length - 1 && start + dots.length < photos.length)
    );
  });
}

/* ── LIGHTBOX — Photos-style viewer: the photo follows the finger, pinch or double-tap to zoom, drag down to close ── */
const SLIDE_GAP = 24;   // px between photos while swiping, as in Photos
const MAX_ZOOM  = 4;
const TAP_ZOOM  = 2.5;
const EASE      = 'cubic-bezier(0.2, 0.8, 0.2, 1)';

const lbBackdrop = document.getElementById('lbBackdrop');
const lbStatus   = document.getElementById('lbStatus');
const slides     = [...document.getElementById('lbTrack').children];  // [previous, current, next], rotated as you move
const behind     = [document.querySelector('main'), document.getElementById('bottomBar'), document.querySelector('footer')];

let zoom = { s: 1, x: 0, y: 0 };
let busy = false;  // a slide animation is running

const dur = sec => `${reduceMotion ? 0 : sec}s`;
const after = (ms, fn) => setTimeout(fn, reduceMotion ? 0 : ms);

function fillSlide(slide, i) {
  const img = slide.querySelector('img');

  slide.dataset.index = i;

  if (i < 0 || i >= photos.length) {
    slide.hidden = true;
    img.removeAttribute('src');
    img.alt = '';
    return;
  }

  slide.hidden = false;
  img.alt = `Photo ${i + 1} of ${photos.length}`;
  img.src = photos[i].thumb;

  const hi = new Image();

  hi.onload = () => {
    if (slide.dataset.index === String(i)) img.src = photos[i].full;
  };

  hi.src = photos[i].full;
}

// VoiceOver reads only the photo on screen, not the neighbours waiting either side
function markCurrent() {
  slides.forEach((slide, k) => {
    if (k === 1) slide.removeAttribute('aria-hidden');
    else slide.setAttribute('aria-hidden', 'true');
  });
}

function placeSlides(dx = 0, animate = false) {
  slides.forEach((slide, k) => {
    slide.style.transition = animate ? `transform ${dur(0.35)} ${EASE}` : 'none';
    slide.style.transform = `translateX(calc(${(k - 1) * 100}% + ${(k - 1) * SLIDE_GAP + dx}px))`;
  });
}

/* ── ZOOM — x and y measured from the screen's centre ── */
function zoomLayer() {
  return slides[1].firstElementChild;
}

function applyZoom(animate) {
  const layer = zoomLayer();

  layer.style.transition = animate ? `transform ${dur(0.3)} ${EASE}` : 'none';
  layer.style.transform = `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})`;

  lb.classList.toggle('zoomed', zoom.s > 1.01);
}

// where the photo sits inside its letterbox at 1x: size, and centre offset from the screen's centre
function photoBox() {
  const layer = zoomLayer();
  const img = layer.querySelector('img');
  const r = img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1;

  let w = img.clientWidth;
  let h = w * r;

  if (h > img.clientHeight) {
    h = img.clientHeight;
    w = h / r;
  }

  return {
    w,
    h,
    cx: img.offsetLeft + img.clientWidth / 2 - layer.clientWidth / 2,
    cy: img.offsetTop + img.clientHeight / 2 - layer.clientHeight / 2,
    W: layer.clientWidth,
    H: layer.clientHeight
  };
}

// keep a zoomed photo covering the screen; a photo smaller than the screen stays centred on that axis
function clampZoom({ s, x, y }) {
  const b = photoBox();

  const fit = (t, c, size, view) => {
    if (size * s <= view) return c * (1 - s);

    const lo = view / 2 - size * s / 2 - c * s;
    const hi = -view / 2 + size * s / 2 - c * s;

    return Math.min(hi, Math.max(lo, t));
  };

  return { s, x: fit(x, b.cx, b.w, b.W), y: fit(y, b.cy, b.h, b.H) };
}

function settleZoom() {
  let { s, x, y } = zoom;

  if (s <= 1) {
    zoom = { s: 1, x: 0, y: 0 };
  } else {
    if (s > MAX_ZOOM) {
      x *= MAX_ZOOM / s;
      y *= MAX_ZOOM / s;
      s = MAX_ZOOM;
    }

    zoom = clampZoom({ s, x, y });
  }

  applyZoom(true);
}

function resetZoom() {
  zoom = { s: 1, x: 0, y: 0 };

  slides.forEach(slide => {
    slide.firstElementChild.style.transition = 'none';
    slide.firstElementChild.style.transform = '';
  });

  lb.classList.remove('zoomed');
}

function local(clientX, clientY) {
  return { x: clientX - lb.clientWidth / 2, y: clientY - lb.clientHeight / 2 };
}

function onPhoto(p) {
  const b = photoBox();
  const cx = (p.x - zoom.x) / zoom.s;
  const cy = (p.y - zoom.y) / zoom.s;

  return Math.abs(cx - b.cx) <= b.w / 2 && Math.abs(cy - b.cy) <= b.h / 2;
}

function toggleZoomAt(clientX, clientY) {
  if (zoom.s > 1.01) {
    zoom = { s: 1, x: 0, y: 0 };
  } else {
    const p = local(clientX, clientY);
    zoom = clampZoom({ s: TAP_ZOOM, x: p.x * (1 - TAP_ZOOM), y: p.y * (1 - TAP_ZOOM) });
  }

  applyZoom(true);
}

/* ── OPEN / CLOSE ── */
function announce() {
  lbStatus.textContent = `Photo ${current + 1} of ${photos.length}`;
}

function resetViewer() {
  resetZoom();
  placeSlides(0, false);

  lb.classList.remove('bare', 'dragging');
  lbBackdrop.style.transition = 'none';
  lbBackdrop.style.opacity = '';
}

function openLb(i) {
  current = i;

  resetViewer();
  fillSlide(slides[0], i - 1);
  fillSlide(slides[1], i);
  fillSlide(slides[2], i + 1);
  markCurrent();

  lastFocused = document.activeElement;

  lb.classList.add('open');
  lb.inert = false;
  behind.forEach(el => { el.inert = true; });
  document.body.style.overflow = 'hidden';

  lb.focus();

  updateLbDots();
  announce();
}

function closeLb(fromDrag = false) {
  clearTimeout(tapTimer);

  if (fromDrag) {
    slides[1].style.transition = `transform ${dur(0.3)} ${EASE}`;
    slides[1].style.transform = `translate(0, ${lb.clientHeight * 0.4}px) scale(0.6)`;
  }

  lb.classList.remove('open');
  lb.inert = true;  // closed, it's out of the Tab order and out of VoiceOver's reach
  behind.forEach(el => { el.inert = false; });
  document.body.style.overflow = '';

  if (lastFocused && lastFocused.focus) {
    lastFocused.focus({ preventScroll: true });
  }

  after(320, () => {
    if (!lb.classList.contains('open')) resetViewer();
  });
}

/* ── MOVE — slide the next photo in, then rotate the three slides so nothing reloads ── */
function slideTo(dir) {
  if (busy || slides[1 + dir].hidden) {
    placeSlides(0, true);
    return;
  }

  busy = true;
  placeSlides(-dir * (lb.clientWidth + SLIDE_GAP), true);

  after(350, () => {
    resetZoom();

    if (dir > 0) slides.push(slides.shift());
    else slides.unshift(slides.pop());

    current += dir;

    fillSlide(slides[1 + dir], current + dir);
    markCurrent();
    placeSlides(0, false);

    busy = false;

    updateLbDots();
    announce();
  });
}

function goNext() {
  slideTo(1);
}

function goPrev() {
  slideTo(-1);
}

/* ── DRAG TO CLOSE ── */
function dragDismiss(dy) {
  const p = Math.min(1, Math.max(0, dy) / lb.clientHeight);

  lb.classList.add('dragging');

  slides[1].style.transition = 'none';
  slides[1].style.transform = `translate(0, ${dy}px) scale(${1 - p * 0.35})`;

  lbBackdrop.style.transition = 'none';
  lbBackdrop.style.opacity = Math.max(0, 1 - p * 1.6);
}

function cancelDismiss() {
  lb.classList.remove('dragging');

  placeSlides(0, true);

  lbBackdrop.style.transition = `opacity ${dur(0.3)} ease`;
  lbBackdrop.style.opacity = '';
}

/* ── GESTURES — pointer events cover touch, pen and mouse ── */
const pointers = new Map();

let g = null;  // the gesture in progress
let suppressClick = false;
let lastTap = null;
let tapTimer = 0;

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

function velocity(gesture) {
  const s = gesture.samples;
  const last = s[s.length - 1];
  const first = s.find(p => last.t - p.t < 100) || last;
  const dt = Math.max(1, last.t - first.t);

  return { x: (last.x - first.x) / dt, y: (last.y - first.y) / dt };
}

function rubber(value, min, max) {
  if (value < min) return min + (value - min) * 0.3;
  if (value > max) return max + (value - max) * 0.3;
  return value;
}

lb.addEventListener('pointerdown', e => {
  if (!lb.classList.contains('open') || busy) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest('.lb-close')) return;

  suppressClick = false;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    g = {
      kind: 'pending',
      x0: e.clientX,
      y0: e.clientY,
      t0: e.timeStamp,
      z0: { ...zoom },
      onButton: !!e.target.closest('button'),
      mouse: e.pointerType === 'mouse',
      samples: [{ x: e.clientX, y: e.clientY, t: e.timeStamp }]
    };
  } else if (pointers.size === 2) {
    if (g && g.kind === 'swipe') placeSlides(0, true);
    if (g && g.kind === 'dismiss') cancelDismiss();

    const [a, b] = [...pointers.values()];
    const m = mid(a, b);

    clearTimeout(tapTimer);
    suppressClick = true;

    g = { kind: 'pinch', d0: dist(a, b), m0: local(m.x, m.y), z0: { ...zoom } };
  }
});

window.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;

  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (!g) return;

  if (g.kind === 'pinch') {
    if (pointers.size < 2) return;

    const [a, b] = [...pointers.values()];
    const m = mid(a, b);
    const p = local(m.x, m.y);

    let s = g.z0.s * dist(a, b) / g.d0;
    s = s < 1 ? 1 - (1 - s) * 0.5 : s > MAX_ZOOM ? MAX_ZOOM + (s - MAX_ZOOM) * 0.3 : s;

    // keep the point first under the fingers under them as they move and spread
    const cx = (g.m0.x - g.z0.x) / g.z0.s;
    const cy = (g.m0.y - g.z0.y) / g.z0.s;

    zoom = { s, x: p.x - cx * s, y: p.y - cy * s };
    applyZoom(false);
    return;
  }

  const dx = e.clientX - g.x0;
  const dy = e.clientY - g.y0;

  g.samples.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
  if (g.samples.length > 8) g.samples.shift();

  if (g.kind === 'pending') {
    if (Math.hypot(dx, dy) < 8) return;

    if (zoom.s > 1.01) g.kind = 'pan';
    else g.kind = Math.abs(dx) > Math.abs(dy) ? 'swipe' : 'dismiss';

    clearTimeout(tapTimer);
    suppressClick = true;
  }

  if (g.kind === 'pan') {
    const want = { s: zoom.s, x: g.z0.x + dx, y: g.z0.y + dy };
    const c = clampZoom(want);

    zoom = { s: zoom.s, x: rubber(want.x, c.x, c.x), y: rubber(want.y, c.y, c.y) };
    applyZoom(false);
  } else if (g.kind === 'swipe') {
    const edge = slides[dx > 0 ? 0 : 2].hidden;
    placeSlides(edge ? dx * 0.3 : dx);
  } else if (g.kind === 'dismiss') {
    dragDismiss(dy > 0 ? dy : dy * 0.2);
  }
});

function endPointer(e, cancelled) {
  if (!pointers.has(e.pointerId)) return;

  pointers.delete(e.pointerId);

  if (!g) return;

  if (g.kind === 'pinch') {
    if (pointers.size < 2) {
      settleZoom();
      g = null;
    }
    return;
  }

  if (pointers.size) return;

  const gesture = g;
  g = null;

  const dx = e.clientX - gesture.x0;
  const dy = e.clientY - gesture.y0;
  const v = velocity(gesture);

  if (gesture.kind === 'pending') {
    if (!cancelled) handleTap(e, gesture);
  } else if (gesture.kind === 'pan') {
    settleZoom();
  } else if (gesture.kind === 'swipe') {
    const width = lb.clientWidth;
    const dir = cancelled ? 0
      : (dx < -width * 0.2 || v.x < -0.35) ? 1
      : (dx > width * 0.2 || v.x > 0.35) ? -1
      : 0;

    if (dir) slideTo(dir);
    else placeSlides(0, true);
  } else if (gesture.kind === 'dismiss') {
    if (!cancelled && (dy > 110 || v.y > 0.5)) closeLb(true);
    else cancelDismiss();
  }
}

window.addEventListener('pointerup', e => endPointer(e, false));
window.addEventListener('pointercancel', e => endPointer(e, true));

// a drag or pinch that ends over a button isn't a press of that button
lb.addEventListener('click', e => {
  if (!suppressClick) return;

  suppressClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

function handleTap(e, gesture) {
  if (gesture.onButton || e.timeStamp - gesture.t0 > 400) return;

  const p = local(e.clientX, e.clientY);

  // with a mouse, a click beside the photo closes the viewer
  if (gesture.mouse && zoom.s <= 1.01 && !onPhoto(p)) {
    closeLb();
    return;
  }

  if (lastTap && e.timeStamp - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
    clearTimeout(tapTimer);
    lastTap = null;
    toggleZoomAt(e.clientX, e.clientY);
    return;
  }

  lastTap = { t: e.timeStamp, x: e.clientX, y: e.clientY };

  // a single tap on a touch screen shows or hides the controls; wait to be sure it isn't a double tap
  tapTimer = setTimeout(() => {
    lastTap = null;
    if (!gesture.mouse) lb.classList.toggle('bare');
  }, 300);
}

// trackpad pinch on a Mac arrives as a ctrl + wheel event
lb.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;

  e.preventDefault();

  const p = local(e.clientX, e.clientY);
  const s = Math.min(MAX_ZOOM, Math.max(1, zoom.s * Math.exp(-e.deltaY * 0.01)));
  const cx = (p.x - zoom.x) / zoom.s;
  const cy = (p.y - zoom.y) / zoom.s;

  zoom = s === 1 ? { s: 1, x: 0, y: 0 } : clampZoom({ s, x: p.x - cx * s, y: p.y - cy * s });
  applyZoom(false);
}, { passive: false });

// stop Safari's own page zoom inside the viewer
lb.addEventListener('gesturestart', e => e.preventDefault());

/* ── CONTROLS ── */
document
  .getElementById('lbClose')
  .addEventListener('click', () => closeLb());

document
  .getElementById('lbPrev')
  .addEventListener('click', goPrev);

document
  .getElementById('lbNext')
  .addEventListener('click', goNext);

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;

  if (e.key === 'Escape') {
    closeLb();
    return;
  }

  if (e.key === 'ArrowRight') {
    goNext();
  }

  if (e.key === 'ArrowLeft') {
    goPrev();
  }

  // keep keyboard focus inside the viewer while it's open
  if (e.key === 'Tab') {
    const stops = [...lb.querySelectorAll('button')].filter(b => b.getClientRects().length);
    const at = stops.indexOf(document.activeElement);
    const next = e.shiftKey
      ? (at <= 0 ? stops.length - 1 : at - 1)
      : (at === -1 || at === stops.length - 1 ? 0 : at + 1);

    e.preventDefault();
    stops[next].focus();
  }
});

window.addEventListener('resize', () => {
  if (!lb.classList.contains('open')) return;

  resetZoom();
  placeSlides(0, false);
}, { passive: true });

window.addEventListener('resize', layoutGrid, { passive: true });

load();
</script>

  const OUT  = '<svg class="mx-icon mx-out" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.5 12.5 3.5M5 3.5h7.5V11"/></svg>';
  const NOTE = '<svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g ><path d="M4.75 11.74V2.91L13.25 1.55V10.38" fill="none" stroke-width="1.5"/><circle cx="2.71" cy="11.74" r="2.44" stroke="none"/><circle cx="11.21" cy="10.38" r="2.44" stroke="none"/></g></svg>';

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const list    = document.getElementById('mxList');
  const full     = document.getElementById('mxFull');
  const scroller = document.getElementById('mxScroll');
  const inner    = document.getElementById('mxInner');
  const backdrop = document.getElementById('mxBackdrop');
  const calm     = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const music   = document.getElementById('mxMusic');
  const lbEl    = document.getElementById('lb');
  const LAST    = 'mx-last-song';

  let last = null;
  try { last = sessionStorage.getItem(LAST); } catch (e) {}

  function render() {
    list.innerHTML = SONGS.map((s, i) => `<a class="mx-row${String(i) === last ? ' last' : ''}${i === half ? ' top2' : ''}" href="${esc(s.url)}" target="_blank" rel="noopener" data-i="${i}"
      aria-label="${esc(s.title)} by ${esc(s.artist)}${String(i) === last ? ', opened last' : ''}, opens in Spotify">
      <span class="mx-num">${String(i) === last ? NOTE : i + 1}</span><span class="mx-text"><span class="mx-title">${esc(s.title)}</span><span class="mx-artist">${esc(s.artist)}</span></span>${OUT}</a>`).join('');
  }

  render();

  // the list's height cap counts the songs
  inner.style.setProperty('--mx-rows', SONGS.length);
  inner.style.setProperty('--mx-half', half);

  /* ── OPEN / CLOSE ── */
  let isOpen = false;

  full.inert = true;  // closed, it's out of the Tab order and out of VoiceOver's reach

  function open() {
    isOpen = true;
    inner.style.transition = '';   // a drag may have left its own timing behind; the rise uses the stylesheet's
    full.inert = false;
    full.classList.add('open');
    music.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';

    // the song opened last comes into view, for picking a different one; only the list scrolls, never the gallery behind
    const lastRow = list.querySelector('.mx-row.last');
    scroller.scrollTop = lastRow ? Math.max(0, lastRow.offsetTop - scroller.clientHeight / 2 + lastRow.offsetHeight / 2) : 0;

    setTimeout(() => full.focus({ preventScroll: true }), 50);
  }

  function close(restoreFocus = true) {
    if (!isOpen) return;

    isOpen = false;
    full.classList.remove('open');
    full.inert = true;
    music.setAttribute('aria-expanded', 'false');

    // the photo viewer keeps the page from scrolling while it's open
    if (!lbEl.classList.contains('open')) document.body.style.overflow = '';

    if (restoreFocus && getComputedStyle(music).opacity !== '0') music.focus({ preventScroll: true });
  }

  music.addEventListener('click', () => (isOpen ? close() : open()));
  document.getElementById('mxClose').addEventListener('click', () => close());

  // choosing a song: Spotify opens, and the list is gone by the time the visitor comes back
  list.addEventListener('click', e => {
    const row = e.target.closest('.mx-row');
    if (!row) return;

    last = row.dataset.i;
    try { sessionStorage.setItem(LAST, last); } catch (err) {}
    setTimeout(render, 400);

    setTimeout(() => close(false), 150);
  });

  // a tap on empty space, beside the songs or up by the X, closes the list; taps on the title or between songs don't
  full.addEventListener('click', e => {
    if (e.target === scroller || e.target === backdrop) close();
  });

  /* ── DRAG DOWN TO CLOSE — the list follows the finger, shrinks a little and uncovers the gallery, as an open photo does ── */
  let drag = null;
  let dragged = false;

  function follow(dy) {
    const p = Math.min(1, Math.max(0, dy) / innerHeight);

    inner.style.transition = 'none';
    inner.style.transform = `translateY(${dy}px) scale(${1 - p * 0.15})`;
    backdrop.style.transition = 'none';
    backdrop.style.opacity = Math.max(0, 1 - p * 1.6);
  }

  function letGo(closing) {
    const t = calm ? 'none' : 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease';

    inner.style.transition = t;
    backdrop.style.transition = t;
    full.classList.remove('dragging');

    if (closing) {
      inner.style.transform = `translateY(${innerHeight * 0.4}px) scale(0.85)`;
      close(false);

      setTimeout(() => {
        inner.style.transition = 'none';
        inner.style.transform = '';
        backdrop.style.transition = 'none';
        backdrop.style.opacity = '';
      }, 320);
    } else {
      inner.style.transform = '';
      backdrop.style.opacity = '';
    }
  }

  scroller.addEventListener('touchstart', e => {
    const t = e.touches[0];

    // only from the top of the list, so a list long enough to scroll still scrolls
    drag = e.touches.length === 1 && scroller.scrollTop <= 0
      ? { x0: t.clientX, y0: t.clientY, active: false, samples: [{ y: t.clientY, t: e.timeStamp }] }
      : null;
  }, { passive: true });

  scroller.addEventListener('touchmove', e => {
    if (!drag) return;

    const t = e.touches[0];
    const dx = t.clientX - drag.x0;
    const dy = t.clientY - drag.y0;

    if (!drag.active) {
      if (Math.hypot(dx, dy) < 8) return;

      if (dy <= 0 || Math.abs(dx) > dy) {
        drag = null;
        return;
      }

      drag.active = true;
      full.classList.add('dragging');
    }

    e.preventDefault();

    drag.samples.push({ y: t.clientY, t: e.timeStamp });
    if (drag.samples.length > 8) drag.samples.shift();

    follow(dy);
  }, { passive: false });

  function endDrag(cancelled) {
    if (!drag) return;

    const d = drag;
    drag = null;

    if (!d.active) return;

    // the click that can follow a drag isn't a tap on a song
    dragged = true;
    setTimeout(() => { dragged = false; }, 400);

    const last = d.samples[d.samples.length - 1];
    const first = d.samples.find(s => last.t - s.t < 100) || last;
    const v = (last.y - first.y) / Math.max(1, last.t - first.t);

    letGo(!cancelled && (last.y - d.y0 > 110 || v > 0.5));
  }

  scroller.addEventListener('touchend', () => endDrag(false));
  scroller.addEventListener('touchcancel', () => endDrag(true));

  full.addEventListener('click', e => {
    if (!dragged) return;

    e.preventDefault();
    e.stopPropagation();
  }, true);

  // if the page is hidden before then (Spotify took over), close at once
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && isOpen) close(false);
  });

  // keys go to the list first while it's open, so Escape and the arrows don't also move the photo viewer
  window.addEventListener('keydown', e => {
    if (!isOpen) return;

    if (e.key === 'Escape') {
      e.stopImmediatePropagation();
      e.preventDefault();
      close();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.stopImmediatePropagation();
    } else if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
      // the arrows move between the songs, as in a list on a Mac, and stop at the first and the last
      e.stopImmediatePropagation();
      e.preventDefault();

      const rows = [...list.querySelectorAll('.mx-row')];
      const at = rows.indexOf(document.activeElement);
      const down = e.key === 'ArrowDown';
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? rows.length - 1
        : at === -1 ? (down ? 0 : rows.length - 1)
        : Math.min(rows.length - 1, Math.max(0, at + (down ? 1 : -1)));

      rows[next].focus();
    } else if (e.key === 'Tab') {
      e.stopImmediatePropagation();

      const stops = [document.getElementById('mxClose'), ...list.querySelectorAll('.mx-row')];
      const at = stops.indexOf(document.activeElement);
      const next = e.shiftKey ? (at <= 0 ? stops.length - 1 : at - 1) : (at === -1 || at === stops.length - 1 ? 0 : at + 1);

      e.preventDefault();
      stops[next].focus();
    }
  }, true);

  // Safari on iPhone holds a pressed look under the finger only on things that listen for touches: this gives the music
  // button and the X theirs (the songs have the list's). Not the whole page, or photos would dim under a scrolling finger
  [music, full].forEach(el => el.addEventListener('touchstart', () => {}, { passive: true }));

  /* ── PLACE — just after <main>, not inside it: the photo viewer makes <main> inert while a photo is open ── */
  document.querySelector('main').after(music);

  // hidden while a photo is open, it's out of the Tab order and out of VoiceOver's reach too
  const hideInViewer = () => {
    music.inert = document.body.classList.contains('mx-viewer');
  };

  /* ── SCROLLING — the button steps back while the gallery moves and comes back as soon as it stops: once the page has
     been still for 150ms. Safari reports the page's position frame by frame while it glides, so a pause that long
     means it has stopped ── */
  let scrollTimer = 0;

  window.addEventListener('scroll', () => {
    document.body.classList.add('mx-scrolling');
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => document.body.classList.remove('mx-scrolling'), 150);
  }, { passive: true });

  /* ── FOLLOW THE PHOTO VIEWER — the button hides while a photo is open and returns when it closes ── */
  new MutationObserver(() => {
    const viewing = lbEl.classList.contains('open');

    document.body.classList.toggle('mx-viewer', viewing);
    hideInViewer();
  }).observe(lbEl, { attributes: true, attributeFilter: ['class'] });

  // the button appears with the photos
  const bottomBar = document.getElementById('bottomBar');
  const ready = setInterval(() => {
    if (getComputedStyle(bottomBar).display !== 'none') {
      document.body.classList.add('mx-ready');
      clearInterval(ready);
    }
  }, 200);
})();
</script>

</body>
</html>
