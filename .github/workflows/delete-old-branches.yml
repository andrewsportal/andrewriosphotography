name: Delete old branches

# One button, once: on the Actions tab, Delete old branches, then Run workflow. It deletes the branches
# named below, whose work is in main or was replaced by later work there, and never main.
# A branch already gone is skipped. Once it has run, this file can go too.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the old branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gone=0; missing=0
          for b in \
            claude/apple-hig-design-polish-68bmtv \
            claude/revert-yellow-element-c00wub \
            claude/website-visual-refinement-8y5qxr \
            cursor/premium-polish-7cd2 \
            hig-audit
          do
            case "$b" in main) echo "kept $b"; continue;; esac
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" --silent 2>/dev/null; then
              echo "deleted $b"; gone=$((gone + 1))
            else
              echo "not there: $b"; missing=$((missing + 1))
            fi
          done
          echo "Deleted $gone; $missing already gone."
